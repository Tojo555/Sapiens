<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Emperor's Road</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
<style>
  /* Layout: same one-card-at-a-time quest engine as the Pyramid Quest, re-skinned as a Roman road with a province tracker. */
  :root {
    --bg: #f4f1ec;
    --surface: #ffffff;
    --surface-2: #ece6dc;
    --text: #241d22;
    --muted: #675c63;
    --border: #ddd3c6;
    --accent: #6e2c5c;      /* imperial purple */
    --accent-ink: #ffffff;
    --gold: #9a6c14;
    --good: #2f7d4f;
    --good-bg: #e3f3e9;
    --bad: #b3402f;
    --bad-bg: #fbe7e3;
    --hint-bg: #f8edd3;
    --shadow: 0 2px 10px rgba(60, 30, 50, 0.12);
    --display: "Cinzel", Georgia, "Times New Roman", serif;
    --serif: Georgia, "Times New Roman", serif;
    --body: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15111a; --surface: #201a24; --surface-2: #2b2330; --text: #f1e9ef;
      --muted: #b6a8b2; --border: #3d3242; --accent: #d996c4; --accent-ink: #1d0f19;
      --gold: #e3b45a; --good: #6fd197; --good-bg: #17301f; --bad: #f08a78; --bad-bg: #3a1c17;
      --hint-bg: #3a2f17; --shadow: 0 2px 10px rgba(0, 0, 0, 0.5); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15111a; --surface: #201a24; --surface-2: #2b2330; --text: #f1e9ef;
    --muted: #b6a8b2; --border: #3d3242; --accent: #d996c4; --accent-ink: #1d0f19;
    --gold: #e3b45a; --good: #6fd197; --good-bg: #17301f; --bad: #f08a78; --bad-bg: #3a1c17;
    --hint-bg: #3a2f17; --shadow: 0 2px 10px rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--body); line-height: 1.5; font-size: 17px; }
  .wrap { max-width: 720px; margin: 0 auto; padding-block: 14px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .stamp { text-align: right; font-size: 12.5px; font-style: italic; color: var(--muted); margin: 0 0 6px; }
  h1, h2, h3 { font-family: var(--serif); line-height: 1.2; margin: 0; text-wrap: balance; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 0 10px; flex-wrap: wrap; }
  .score-pill { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 15px; box-shadow: var(--shadow); color: var(--gold); font-variant-numeric: tabular-nums; }
  .powerups { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .road { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; padding: 0; list-style: none; }
  .road li { flex: 1 1 90px; min-width: 0; text-align: center; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; padding: 6px 4px; border-radius: 8px; border: 1px dashed var(--border); color: var(--muted); background: transparent; }
  .road li.done { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); font-weight: 700; }
  .road li.now { border: 2px solid var(--accent); color: var(--text); font-weight: 700; background: var(--surface); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
  .badge { display: inline-block; font-family: var(--display); font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: var(--accent); margin-bottom: 6px; }
  .card h2 { font-size: 24px; margin-bottom: 8px; }
  .prompt { font-size: 18px; margin: 10px 0 14px; }
  .meta { font-size: 14px; color: var(--muted); }
  .hero { text-align: center; padding: 8px 0 4px; }
  .hero .emoji { font-size: 54px; }
  .hero h1 { font-family: var(--display); font-size: 36px; letter-spacing: 0.03em; margin: 6px 0; color: var(--accent); }
  .rules { text-align: left; background: var(--surface-2); border-radius: 12px; padding: 12px 16px; margin: 16px 0; font-size: 15.5px; }
  .rules ul { margin: 6px 0 0; padding-left: 20px; }
  .rules li { margin: 3px 0; }
  button { font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 10px 14px; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  button.ghost { background: transparent; }
  .opt { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 12px 14px; }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt.right { background: var(--good-bg); border-color: var(--good); color: var(--text); }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--text); }
  .opt.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  textarea { width: 100%; box-sizing: border-box; min-height: 88px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; resize: vertical; }
  textarea:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  label.field { display: block; font-weight: 700; font-size: 14.5px; margin: 14px 0 4px; }
  .fieldhelp { display: block; font-weight: 400; color: var(--muted); font-size: 13.5px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .hintbox { background: var(--hint-bg); border-left: 5px solid var(--gold); border-radius: 8px; padding: 10px 12px; margin-top: 12px; font-size: 15.5px; }
  .feedback { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 15.5px; }
  .feedback.good { background: var(--good-bg); }
  .feedback.bad { background: var(--bad-bg); }
  .scorebox { margin-top: 16px; padding: 12px; border: 2px dashed var(--border); border-radius: 12px; }
  .scorebox p { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
  .scorebtns { display: flex; gap: 8px; flex-wrap: wrap; }
  .scorebtns button { min-width: 46px; font-weight: 700; }
  .scorebtns button.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .scorelabels { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-top: 6px; gap: 10px; }
  .master { margin-top: 14px; background: var(--good-bg); border-left: 5px solid var(--good); border-radius: 8px; padding: 10px 14px; }
  .master p { margin: 6px 0 0; font-size: 16px; }
  .master ul { margin: 6px 0 0; padding-left: 20px; font-size: 16px; }
  .master li { margin: 4px 0; }
  .refresher { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin: 0 0 14px; font-size: 15.5px; }
  .refresher summary { cursor: pointer; font-weight: 700; }
  .refresher ul { margin: 8px 0 2px; padding-left: 20px; }
  .refresher li { margin: 4px 0; }
  .timer { font-size: 44px; font-weight: 800; text-align: center; color: var(--gold); font-variant-numeric: tabular-nums; }
  .final-score { font-size: 56px; font-weight: 800; text-align: center; color: var(--gold); margin: 4px 0; font-variant-numeric: tabular-nums; }
  .rank { text-align: center; font-family: var(--display); font-size: 24px; margin-bottom: 10px; color: var(--accent); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15.5px; margin: 10px 0; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; }
  .sent { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin: 10px 0; background: var(--bg); }
  .sent p { margin: 0 0 8px; font-size: 16.5px; }
  .labbtns { display: flex; gap: 6px; flex-wrap: wrap; }
  .labbtns button { padding: 6px 10px; font-size: 14px; }
  .labbtns button.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .labbtns button.right { background: var(--good-bg); border-color: var(--good); color: var(--text); font-weight: 700; opacity: 1; }
  .labbtns button.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--text); opacity: 1; }
  .items { margin: 4px 0 0; padding-left: 20px; }
  .items li { margin: 6px 0; }
  .navrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin: -4px 0 12px; }
  .navrow .grp { display: flex; gap: 6px; flex-wrap: wrap; }
  button.small { padding: 6px 12px; font-size: 14px; }
  .confirm { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14px; background: var(--bad-bg); border-radius: 10px; padding: 6px 10px; }
  button.danger { background: var(--bad); color: var(--surface); border-color: var(--bad); font-weight: 700; }
  .foot { margin-top: 22px; font-size: 12.5px; color: var(--muted); text-align: center; }
  @media (max-width: 480px) {
    body { font-size: 16px; }
    .hero h1 { font-size: 28px; }
    .card { padding: 16px; }
    .road li { flex-basis: 30%; font-size: 11px; }
  }
</style>

</head>
<body>
<div class="wrap">
  <p class="stamp">Prepared with AI support, reviewed by Mr. Johnson</p>
  <div class="topbar" id="topbar" hidden>
    <div class="score-pill" id="scorePill">⭐ 0 pts</div>
    <div class="powerups" id="powerStatus"></div>
  </div>
  <ol class="road" id="road" hidden aria-label="Provinces on the Emperor's Road"></ol>
  <main id="stage" aria-live="polite"></main>
  <p class="foot">Sapiens Quest · Chapter 11, “Imperial Visions” · A reading diagnostic game</p>
</div>

<script>
(function () {
  "use strict";

  // ---------- Content ----------
  var LABELS2 = ["Not yet", "Getting there", "Nailed it"];

  var CARDS = [
    // ===== Level 1: Numantia · Homework Check =====
    { id: "1A", level: 1, type: "steps", max: 2,
      title: "Card 1A · Your Two Answers",
      prompt: "Your homework asked the same question twice: “Are empires bad? Why or why not?” Copy in both answers, then tell what happened between them.",
      fields: [
        { label: "Before I read, I said…" },
        { label: "After I read, I said…" },
        { label: "What changed my mind, or why it didn’t change", help: "Name something specific from the chapter: a story, a claim or an example." }
      ],
      masterTitle: "🗝️ What Mr. Johnson is listening for",
      masterList: [
        "Both answers give a reason, not just “yes” or “no.”",
        "The third answer points to something specific in Chapter 11 (Numantia, Cyrus, the Mandate of Heaven, India, the Imperial Cycle).",
        "If your view didn’t change, you can still name the part of Harari’s argument you would have to answer.",
        "Changing your mind and keeping your mind are both fine. The reason is what counts."
      ],
      hint: "Look back at your two written answers. What did Harari say that made you pause, even for a second?",
      labels: LABELS2 },

    { id: "1B", level: 1, type: "mc", max: 1,
      title: "Card 1B · The Underlined Definition",
      prompt: "You underlined Harari’s definition of an empire. Which choice matches it?",
      options: [
        "A political order that rules a very large territory and population, and that has flexible borders and a potentially unlimited appetite for more land",
        "A political order that rules many distinct peoples, each with its own identity and territory, and that keeps its borders fixed so they can be governed steadily",
        "A political order that rules many distinct peoples, each with its own identity and territory, and that has flexible borders and a potentially unlimited appetite for more",
        "A political order that conquers many distinct peoples by force of arms, and that has flexible borders and a potentially unlimited appetite for more"
      ],
      correct: 2,
      explain: "Harari’s two parts are (1) cultural diversity: many distinct peoples, each with its own identity and land; and (2) territorial flexibility: borders that can keep growing, with an appetite for more. Each wrong answer breaks one rule. Size and population don’t count, fixed borders contradict part 2, and conquest describes how an empire began, which Harari says doesn’t matter.",
      hint: "His definition has two parts. One is about the people inside. The other is about the borders." },

    { id: "1D", level: 1, type: "mc", max: 1,
      title: "Card 1C · The Small Democracy",
      prompt: "Using Harari’s definition, could a small democracy be an empire?",
      options: [
        "No, because only kings and emperors rule empires",
        "No, because empires have to be huge",
        "Yes, if it rules many different peoples and keeps expanding, like ancient Athens",
        "Yes, but only if it has more than a million people"
      ],
      correct: 2,
      explain: "Harari’s example is Athens: a democracy, and smaller than modern Greece, yet it ruled many other peoples. Size and government type aren’t part of the definition.",
      hint: "Harari lists things that do NOT define an empire. Are size and type of government on that list?" },

    // ===== Level 2: Persia · Climb the Road =====
    { id: "2B", level: 2, type: "mc", max: 1,
      title: "Step 1 of 5 · The Twist",
      prompt: "Modern Spaniards honor the Numantians as heroes. What twist does Harari point out?",
      options: [
        "Numantia’s stand inspired other Iberian towns to rise up, which is why Rome eventually lost its hold on Spain",
        "Spaniards remember Numantia mostly because of Cervantes’s play, so its fame comes more from fiction than history",
        "They honor the heroes in Spanish, a language grown from Latin, and live with Roman-rooted law and religion, so Rome still won",
        "The Roman writers who recorded the siege exaggerated the defenders’ courage to make Scipio’s victory look greater"
      ],
      correct: 2,
      explain: "Harari’s point is that the empire won culturally, even in the memory of its victims: the heroes’ fans speak a descendant of the conquerors’ language and live with the conquerors’ legacies. Cervantes did write a play about Numantia, but that isn’t Harari’s twist, and Rome didn’t lose Spain.",
      hint: "What language do Spaniards speak, and where did it come from?" },

    { id: "2C", level: 2, type: "mc", max: 1,
      title: "Step 2 of 5 · For Your Own Good",
      prompt: "Harari presents Cyrus the Great of Persia as an early ruler with a new kind of message. What was it?",
      options: [
        "“I conquer you because Heaven has chosen me to rule all under heaven.”",
        "“I conquer you to spread the one true Persian faith to every people.”",
        "“I conquer you so that Persia may grow rich from your tribute.”",
        "“I conquer you for your own benefit, as the king of all peoples.”"
      ],
      correct: 3,
      explain: "Cyrus claimed to rule all peoples for their benefit. Harari’s example: Cyrus let the exiled Jews return to Judah and rebuild their Temple, instead of forcing his own religion on them. “Chosen by Heaven to rule all under heaven” is China’s Mandate of Heaven, the next card.",
      hint: "Think of the section title “It’s for Your Own Good.” And remember what Cyrus let the Jews do with their own Temple." },

    { id: "2D", level: 2, type: "mc", max: 1,
      title: "Step 3 of 5 · The Mandate of Heaven",
      prompt: "What was the Mandate of Heaven?",
      options: [
        "The Chinese belief that one royal family rules forever by divine right, however badly it governs",
        "The Chinese belief that Heaven gives a ruler the right and duty to rule all under heaven and bring harmony",
        "The Chinese belief that each region has its own heavenly ruler, so the land should stay divided",
        "The Persian belief that the gods chose Cyrus to free conquered peoples and rule them with kindness"
      ],
      correct: 1,
      explain: "In China, emperors claimed Heaven had chosen them to rule everyone and bring harmony. After unification, Chinese tradition treated a united empire as normal and division as a temporary breakdown. The mandate wasn’t a family’s forever-right: in Chinese tradition, a ruler who governed badly could lose it.",
      hint: "Harari connects this idea to the belief that China should be united, not split apart." },

    { id: "2E", level: 2, type: "mc", max: 1,
      title: "Step 4 of 5 · How Empires Fell",
      prompt: "According to Harari, how did empires usually come to an end?",
      options: [
        "Conquered peoples rose up and overthrew them",
        "They ran out of money",
        "Invasion from outside, or a split inside the ruling group",
        "Their citizens voted to end them"
      ],
      correct: 2,
      explain: "Harari argues empires were surprisingly stable. Revolts by conquered peoples usually failed. Empires mostly fell to outside invaders or to splits among the ruling elite.",
      hint: "Harari says one answer is what most people expect, and he argues it’s usually wrong." },

    { id: "2F", level: 2, type: "mc", max: 1,
      title: "Step 5 of 5 · Turning the Tables",
      prompt: "How did Indian nationalists fight British rule, according to Harari?",
      options: [
        "By reviving ancient Indian traditions and rejecting British ideas, language and schools until the empire lost its hold",
        "By convincing British voters that the empire cost too much, so Parliament chose to grant India its independence",
        "By joining with other conquered peoples across the empire to form one army that drove the British out of India",
        "By using ideas they learned through the empire, like nationalism, democracy and self-determination, often argued in English"
      ],
      correct: 3,
      explain: "This is one of Harari’s favorite ironies: the conquered adopt the empire’s culture and then use the empire’s own ideas to demand equality and independence. Rejecting everything British is the opposite of his point, and he goes on to ask whether it would even be possible.",
      hint: "What language did many Indian leaders write and argue in?" },

    // ===== Level 3: China · Story or Claim? =====
    { id: "3A", level: 3, type: "label", max: 6,
      title: "Card 3A · N or C?",
      prompt: "You marked N for story parts and C for claims while you read. Now label these. (They’re written in Harari’s style, not copied word for word.)",
      refresherTitle: "📚 N vs. C (tap to open or close)",
      refresher: [
        "N · Narration: tells what happened, like a story. Usually has specific people, places, times.",
        "C · Claim: makes an argument or a big general statement someone could disagree with. It needs evidence."
      ],
      choices: ["N · Narration", "C · Claim"],
      sentences: [
        { text: "In 134 BC, a Roman army surrounded the town of Numantia in Spain.", correct: 0 },
        { text: "Empires have been the world’s most common form of political organization for the last 2,500 years.", correct: 1 },
        { text: "Cyrus allowed the exiled Jews to return to Judah and rebuild their Temple.", correct: 0 },
        { text: "It is very hard to divide history neatly into good guys and bad guys.", correct: 1 },
        { text: "Rather than surrender, the defenders chose to destroy their own town.", correct: 0 },
        { text: "In the future, the world will probably be run by a global empire with no single nation in charge.", correct: 1 }
      ],
      explain: "The N sentences tell what happened at a specific time and place. The C sentences are general statements someone could argue with. The last one is a special kind of claim: a prediction.",
      hint: "Ask: could someone reasonably disagree with this? If yes, it’s probably a C." },

    { id: "3B", level: 3, type: "mc", max: 1,
      title: "Card 3B · Find the Pivot",
      prompt: "Harari opens with the Numantia story, then turns it into an argument. Which sentence is the pivot, where the story becomes a claim?",
      options: [
        "Scipio’s army surrounded the town and cut off its food supply.",
        "Numantia was a small Celtic-Iberian town in Spain.",
        "Modern Spaniards who honor Numantia’s heroes do so in a language that grew out of Scipio’s Latin, which shows the empire won in the end.",
        "After many months, the defenders ran out of food."
      ],
      correct: 2,
      explain: "Three of these just tell the story (N). The third choice makes an argument about what the story means (C), and it gives evidence (the language) in the same sentence.",
      hint: "Which sentence would still make sense as a point in a debate?" },

    { id: "3C", level: 3, type: "mc", max: 1,
      title: "Card 3C · Claim Meets Evidence",
      prompt: "Harari claims empires were very stable, not shaky. All four choices below sound like they come from Chapter 11, but only one is the evidence he gives for THIS claim. Which one?",
      options: [
        "Over generations, conquered peoples absorbed the imperial culture so fully that they stopped seeing themselves as conquered",
        "Empires claimed to rule for the good of all peoples, so their subjects had little reason to resent or resist their rulers",
        "Empires often lasted for centuries and usually fell to outside invaders or splits among the elite, not to subjects’ revolts",
        "Empires kept armies stationed across their provinces, so any uprising could be crushed before it had a chance to spread"
      ],
      correct: 2,
      explain: "Harari backs up “stable” with how long empires lasted and how they ended. The first choice is evidence for a different claim (“they” become “we”). The second describes imperial ideology, the stories empires told, not proof that it worked. The fourth isn’t Harari’s evidence at all. It’s closer to a critic’s point: maybe empires lasted because they crushed revolts. Hold on to that idea for Level 5.",
      hint: "Ask which choice is actually about how long empires lasted and what brought them down." },

    { id: "3D", level: 3, type: "steps", max: 2,
      title: "Card 3D · One of Your C’s",
      prompt: "Open your book to a paragraph where you marked a C. Fill these in.",
      fields: [
        { label: "The claim, in my own words" },
        { label: "The evidence Harari uses" },
        { label: "Is the evidence relevant? Is it enough?", help: "Relevant means it’s actually about the claim. Enough means it would convince a careful reader." }
      ],
      masterTitle: "🗝️ Model answer (one example)",
      masterList: [
        "Claim: Conquered peoples often ended up taking the empire’s culture as their own, and then used it against the empire.",
        "Evidence: The Imperial Cycle table (Rome, Islam, European imperialism) and the example of Indian nationalists using British ideas.",
        "Relevant? Yes, all three examples show the pattern. Enough? Maybe not: three empires is a small number for a rule about all of history. Does it fit the Aztecs or the Mongols?"
      ],
      hint: "Short is fine. One clear claim, one piece of evidence, one honest judgment.",
      labels: LABELS2 },

    // ===== Level 4: Gaul · They Become We =====
    { id: "4A", level: 4, type: "open", max: 2,
      title: "Card 4A · Why Not Just “Evil”?",
      prompt: "Harari admits empires killed, enslaved and exploited many people. So why won’t he simply call empires evil?",
      hint: "Think about the language you’re reading this in, and about what Indian nationalists did with British ideas.",
      master: "Because much of the culture people value today came from empires: languages, laws, art, buildings and religions. If we threw away everything imperial, we would throw away a lot of our own heritage. Harari also says history doesn’t split cleanly into good guys and bad guys. His point is that empires are complicated, not that they were good. He never says the violence was okay.",
      labels: LABELS2 },

    { id: "4B", level: 4, type: "mc", max: 1,
      title: "Card 4B · More Than Swords",
      prompt: "Besides force, how did empires hold so many different peoples together? Pick the answer Harari would give.",
      options: [
        "With trade routes and shared coins that made conquered peoples too prosperous to want their independence",
        "By letting every conquered people keep its own separate culture forever, so no one felt pressure to change",
        "With universal ideologies claiming to rule for everyone’s good, and assimilation that slowly turned “them” into “us”",
        "With written law codes that treated every subject as an equal citizen from the very first day of conquest"
      ],
      correct: 2,
      explain: "Harari names two tools: universal ideologies (Cyrus’s claim, the Mandate of Heaven) and cultural assimilation over generations (Romanization, Hellenization, Sinicization). Trade and coins belong to Chapter 10’s story about money. Empires did tolerate many local customs, but over time they spread a shared culture. And equal citizenship came slowly, sometimes centuries later, not on day one.",
      hint: "One tool is a story the rulers told. The other is something that happened to people slowly, over generations." },

    { id: "4C", level: 4, type: "mc", max: 1,
      title: "Card 4C · Back to Chapters 2 and 6",
      prompt: "Is the Mandate of Heaven a shared fiction (Chapter 2) or an imagined order (Chapter 6)? Pick the best answer.",
      options: [

  var LEVEL_INFO = {
    1: { name: "Level 1 · Numantia", sub: "Homework Check", place: "Numantia" },
    2: { name: "Level 2 · Persia", sub: "Climb the Road", place: "Persia" },
    3: { name: "Level 3 · China", sub: "Story or Claim?", place: "China" },
    4: { name: "Level 4 · Gaul", sub: "“They” Become “We”", place: "Gaul" },
    5: { name: "Level 5 · India", sub: "Weigh the Evidence", place: "India" },
    6: { name: "Looking Ahead · The Temple Gate", sub: "Setting Up Chapter 12", place: "Temple Gate" }
  };

  var MAX_MAIN = CARDS.reduce(function (s, c) { return s + (c.level <= 5 ? c.max : 0); }, 0);

  // ---------- State ----------
  var state;
  function freshState() {
    return { idx: -1, maxIdx: 0, pts: {}, answered: {}, submitted: {}, rewindUsed: null, hintUsed: null, hintShown: {}, mcPick: {}, labPick: {}, multiPick: {}, texts: {}, timer: null };
  }
  state = freshState();

  // Saved progress (this browser only; the game still works if storage is blocked)
  var SAVE_KEY = "sapiens-emperors-road-v1";
  function plain(s) { return JSON.parse(JSON.stringify(s, function (k, v) { return k === "timer" ? null : v; })); }
  function save() { try { if (state.idx >= 0) localStorage.setItem(SAVE_KEY, JSON.stringify(plain(state))); } catch (e) {} }
  function loadSaved() {
    try { var s = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); return (s && typeof s.idx === "number" && s.idx >= 0) ? s : null; }
    catch (e) { return null; }
  }
  function clearSaved() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
  function resumeFrom(s) {
    state = s; state.timer = null;
    if (typeof state.maxIdx !== "number") state.maxIdx = state.idx;
    renderCard();
  }
  function resetAll() {
    clearTimer(); clearSaved();
    state = freshState();
    showIntro();
  }

  var stage = document.getElementById("stage");
  var topbar = document.getElementById("topbar");
  var road = document.getElementById("road");
  var scorePill = document.getElementById("scorePill");
  var powerStatus = document.getElementById("powerStatus");

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  function totalPoints() {
    var t = 0;
    Object.keys(state.pts).forEach(function (k) { t += state.pts[k]; });
    return t;
  }

  function updateHud(finished) {
    save();
    scorePill.textContent = "⭐ " + totalPoints() + " pts";
    powerStatus.textContent = "";
    powerStatus.appendChild(el("span", { text: state.rewindUsed ? "🔄 Rewind used" : "🔄 Rewind ready" }));
    powerStatus.appendChild(el("span", { text: state.hintUsed ? "📜 Ask the Historian used" : "📜 Ask the Historian ready" }));
    var curLevel = finished ? 7 : (CARDS[state.idx] ? CARDS[state.idx].level : 1);
    road.textContent = "";
    [1, 2, 3, 4, 5, 6].forEach(function (lv) {
      var cls = lv < curLevel ? "done" : (lv === curLevel ? "now" : "");
      var li = el("li", { class: cls, text: (lv < curLevel ? "✓ " : "") + LEVEL_INFO[lv].place });
      if (lv === curLevel) li.setAttribute("aria-current", "step");
      road.appendChild(li);
    });
  }

  // ---------- Screens ----------
  function showIntro() {
    clearTimer();
    var saved = loadSaved();
    state = freshState();
    topbar.hidden = true; road.hidden = true;
    stage.textContent = "";
    var ul = el("ul");
    [
      "March along the Emperor’s Road and claim five provinces: Numantia (your homework), Persia (five questions that get harder), China (story or claim?), Gaul (big ideas) and India (weighing the evidence, plus the Boss Round). The Temple Gate at the end has no points and sets up Chapter 12.",
      "Multiple-choice and sorting cards check themselves.",
      "For the written cards, type your answer and press Submit. A master answer appears so you can compare, and then Mr. Johnson awards the points.",
      "You get two one-time power-ups: 🔄 Rewind (20 seconds to look back in your book) and 📜 Ask the Historian (a small hint).",
      "Using a power-up costs nothing. It just shows where the trickiest ideas are.",
      "Use ◀ Back and Forward ▶ to move between cards you’ve already reached. Your answers and points are saved on this device, even if you close the page.",
      "↺ Reset erases all answers and points so the game can be played again from the start."
    ].forEach(function (t) { ul.appendChild(el("li", { text: t })); });
    var card = el("section", { class: "card" }, [
      el("div", { class: "hero" }, [
        el("div", { class: "emoji", text: "🏛️", "aria-hidden": "true" }),
        el("h1", { text: "The Emperor’s Road" }),
        el("p", { class: "meta", text: "Sapiens Chapter 11: “Imperial Visions”" })
      ]),
      el("p", { class: "prompt", text: "Greetings, young governor! The Emperor is looking for someone who truly understands what holds an empire together, and who can tell a good argument from a weak one. Prove it, province by province, and earn your audience at the end of the road." }),
      el("div", { class: "rules" }, [el("strong", { text: "How the game works" }), ul]),
      el("div", { class: "row", id: "introRow" })
    ]);
    stage.appendChild(card);
    var introRow = document.getElementById("introRow");
    if (saved) {
      var where = saved.idx >= CARDS.length ? "the results" : "card " + CARDS[saved.idx].id;
      introRow.appendChild(el("button", { class: "primary", text: "Continue where you left off (" + where + ") ▶", onclick: function () { resumeFrom(saved); } }));
      introRow.appendChild(resetControl("↺ Start over"));
    } else {
      introRow.appendChild(el("button", { class: "primary", text: "Set out on the road ▶", onclick: function () { state.idx = 0; state.maxIdx = 0; renderCard(); } }));
    }
    window.scrollTo(0, 0);
  }

  function renderCard() {
    clearTimer();
    if (state.idx >= CARDS.length) { showFinal(); return; }
    var c = CARDS[state.idx];
    topbar.hidden = false; road.hidden = false;
    updateHud();
    stage.textContent = "";

    var info = LEVEL_INFO[c.level];
    var card = el("section", { class: "card" }, [
      el("div", { class: "badge", text: info.name + " · " + info.sub }),
      el("h2", { text: c.title }),
      el("p", { class: "prompt", text: c.prompt })
    ]);
    card.insertBefore(navRow(), card.firstChild);
    var holder = el("div", { id: "cardBody" });
    card.appendChild(holder);
    stage.appendChild(card); // attach first, so saved answers can be redrawn when revisiting a card

    if (c.type === "mc") buildMC(c, holder);
    else if (c.type === "label") buildLabel(c, holder);
    else if (c.type === "multi") buildMulti(c, holder);
    else if (c.type === "think") buildThink(c, holder);
    else if (c.type === "steps") buildSteps(c, holder);
    else buildOpen(c, holder);

    if (c.hint) {
      var tools = el("div", { class: "row", id: "tools" });
      var rb = el("button", { class: "ghost", id: "rewindBtn", text: "🔄 Rewind", onclick: function () { useRewind(c); } });
      var hb = el("button", { class: "ghost", id: "hintBtn", text: "📜 Ask the Historian", onclick: function () { useHint(c); } });
      if (state.rewindUsed && state.rewindUsed !== c.id) rb.disabled = true;
      if (state.hintUsed && state.hintUsed !== c.id) hb.disabled = true;
      tools.appendChild(rb); tools.appendChild(hb);
      card.appendChild(tools);
    }
    card.appendChild(el("div", { id: "toolOut" }));
    if (state.hintShown[c.id]) showHintBox(c);
    window.scrollTo(0, 0);
  }

  function nextBtn(label) {
    return el("button", { class: "primary", id: "nextBtn", text: label || "Next card ▶", onclick: function () {
      state.idx += 1;
      state.maxIdx = Math.max(state.maxIdx || 0, state.idx);
      renderCard();
    } });
  }

  function navRow() {
    var back = el("button", { class: "ghost small", text: "◀ Back", "aria-label": "Go back to the previous card", onclick: function () { state.idx -= 1; renderCard(); } });
    back.disabled = state.idx <= 0;
    var fwd = el("button", { class: "ghost small", text: "Forward ▶", "aria-label": "Go forward to the next card you already reached", onclick: function () { state.idx += 1; renderCard(); } });
    fwd.disabled = state.idx >= (state.maxIdx || 0);
    return el("div", { class: "navrow" }, [
      el("div", { class: "grp" }, [back, fwd]),
      resetControl("↺ Reset")
    ]);
  }

  function resetControl(label) {
    var wrap = el("div", { class: "grp" });
    var btn = el("button", { class: "ghost small", text: label, onclick: function () {
      wrap.textContent = "";
      wrap.appendChild(el("div", { class: "confirm" }, [
        el("span", { text: "Erase all answers and points?" }),
        el("button", { class: "small danger", text: "Yes, reset", onclick: resetAll }),
        el("button", { class: "small", text: "Cancel", onclick: function () { wrap.textContent = ""; wrap.appendChild(btn); } })
      ]));
    } });
    wrap.appendChild(btn);
    return wrap;
  }

  // Multiple choice
  function buildMC(c, holder) {
    var list = el("div", { id: "opts" });
    c.options.forEach(function (o, i) {
      list.appendChild(el("button", { class: "opt", text: o, onclick: function () { pickMC(c, i); } }));
    });
    holder.appendChild(list);
    holder.appendChild(el("div", { id: "mcOut" }));
    if (state.answered[c.id]) restoreMC(c);
  }
  function pickMC(c, i) {
    if (state.answered[c.id]) return;
    state.answered[c.id] = true;
    state.mcPick[c.id] = i;
    state.pts[c.id] = (i === c.correct) ? c.max : 0;
    updateHud();
    restoreMC(c);
  }
  function restoreMC(c) {
    var pick = state.mcPick[c.id];
    document.querySelectorAll("#opts .opt").forEach(function (b, i) {
      b.disabled = true; b.style.opacity = "1";
      if (i === c.correct) b.classList.add("right");
      else if (i === pick) b.classList.add("wrong");
    });
    var out = document.getElementById("mcOut");
    out.textContent = "";
    var ok = pick === c.correct;
    out.appendChild(el("div", { class: "feedback " + (ok ? "good" : "bad"), text: (ok ? "✅ Correct! +1. " : "❌ Not quite. ") + c.explain }));
    out.appendChild(el("div", { class: "row" }, [nextBtn()]));
  }

  // Discussion card (no points)
  function buildThink(c, holder) {
    if (c.level === 6) {
      holder.appendChild(el("div", { class: "hintbox" }, [
        el("strong", { text: "✍️ Write it down: " }),
        el("span", { text: "Write your answer to this card in the place Mr. Johnson told you to use, and bring it to Session 10." })
      ]));
    }
    if (c.items) {
      var ul = el("ul", { class: "items" });
      c.items.forEach(function (t) { ul.appendChild(el("li", { text: t })); });
      holder.appendChild(ul);
    }
    if (c.master) {
      var box = el("div", { class: "feedback good", id: "masterBox", text: "💡 Model answer: " + c.master });
      box.hidden = !state.answered[c.id];
      var rv = el("button", { class: "ghost", text: "💡 Show a model answer", onclick: function () {
        state.answered[c.id] = true; box.hidden = false; rv.hidden = true;
      } });
      rv.hidden = !box.hidden;
      holder.appendChild(el("div", { class: "row" }, [rv]));
      holder.appendChild(box);
    }
    var isLast = state.idx >= CARDS.length - 1;
    holder.appendChild(el("div", { class: "row" }, [nextBtn(isLast ? "See the results ▶" : "Next ▶")]));
  }

  // Multi-select
  function buildMulti(c, holder) {
    var picks = state.multiPick[c.id] = state.multiPick[c.id] || [];
    holder.appendChild(el("p", { class: "meta", text: "Pick exactly " + c.pick + "." }));
    var list = el("div", { id: "opts" });
    var btns = [];
    c.options.forEach(function (o, i) {
      var b = el("button", { class: "opt", text: o, "aria-pressed": "false", onclick: function () {
        if (state.answered[c.id]) return;
        var k = picks.indexOf(i);
        if (k >= 0) picks.splice(k, 1);
        else if (picks.length < c.pick) picks.push(i);
        refresh();
      } });
      btns.push(b); list.appendChild(b);
    });
    holder.appendChild(list);
    var chk = el("button", { class: "primary", text: "Check my picks", onclick: function () { checkMulti(c, btns, picks); } });
    holder.appendChild(el("div", { class: "row", id: "multiCheckRow" }, [chk]));
    holder.appendChild(el("div", { id: "multiOut" }));
    function refresh() {
      btns.forEach(function (b, i) {
        var on = picks.indexOf(i) >= 0;
        b.classList.toggle("sel", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
      chk.disabled = picks.length !== c.pick;
    }
    refresh();
    if (state.answered[c.id]) checkMulti(c, btns, picks);
  }
  function checkMulti(c, btns, picks) {
    var score = 0;
    picks.forEach(function (i) { if (c.correct.indexOf(i) >= 0) score++; });
    btns.forEach(function (b, i) {
      b.disabled = true; b.classList.remove("sel"); b.style.opacity = "1";
      if (c.correct.indexOf(i) >= 0) b.classList.add("right");
      else if (picks.indexOf(i) >= 0) b.classList.add("wrong");
    });
    state.answered[c.id] = true;
    state.pts[c.id] = score;
    updateHud();
    var cr = document.getElementById("multiCheckRow");
    if (cr) cr.hidden = true;
    var out = document.getElementById("multiOut");
    out.textContent = "";
    out.appendChild(el("div", { class: "feedback " + (score === c.max ? "good" : "bad"), text: (score === c.max ? "✅ All " + c.max + "! " : "You found " + score + " of " + c.max + ". ") + c.explain }));
    out.appendChild(el("div", { class: "row" }, [nextBtn()]));
  }

  // Sorting / labeling
  function buildLabel(c, holder) {
    var picks = state.labPick[c.id] = state.labPick[c.id] || [];
    var det = el("details", { class: "refresher", open: "" });
    det.appendChild(el("summary", { text: c.refresherTitle }));
    var ul = el("ul");
    c.refresher.forEach(function (t) { ul.appendChild(el("li", { text: t })); });
    det.appendChild(ul);
    holder.appendChild(det);

    var rows = [];
    c.sentences.forEach(function (s, i) {
      var row = el("div", { class: "sent" });
      row.appendChild(el("p", { text: (i + 1) + ". " + s.text }));
      var bw = el("div", { class: "labbtns" });
      var btns = [];
      c.choices.forEach(function (ch, j) {
        var b = el("button", { text: ch, "aria-pressed": "false", onclick: function () {
          if (state.answered[c.id]) return;
          picks[i] = j; refresh();
        } });
        btns.push(b); bw.appendChild(b);
      });
      row.appendChild(bw);
      rows.push(btns);
      holder.appendChild(row);
    });

    var chk = el("button", { class: "primary", text: "Check my labels", onclick: function () { checkLabels(c, rows, picks); } });
    holder.appendChild(el("div", { class: "row", id: "checkRow" }, [chk]));
    holder.appendChild(el("div", { id: "labOut" }));

    function picked() { var n = 0; for (var k = 0; k < c.sentences.length; k++) if (picks[k] !== undefined && picks[k] !== null) n++; return n; }
    function refresh() {
      rows.forEach(function (btns, i) {
        btns.forEach(function (b, j) {
          var on = picks[i] === j;
          b.classList.toggle("sel", on);
          b.setAttribute("aria-pressed", on ? "true" : "false");
        });
      });
      chk.disabled = picked() < c.sentences.length;
    }
    refresh();
    if (state.answered[c.id]) checkLabels(c, rows, picks);
  }
  function checkLabels(c, rows, picks) {
    var score = 0;
    rows.forEach(function (btns, i) {
      var good = c.sentences[i].correct;
      if (picks[i] === good) score++;
      btns.forEach(function (b, j) {
        b.disabled = true; b.classList.remove("sel");
        if (j === good) b.classList.add("right");
        else if (j === picks[i]) b.classList.add("wrong");
      });
    });
    state.answered[c.id] = true;
    state.pts[c.id] = score;
    updateHud();
    var cr = document.getElementById("checkRow");
    if (cr) cr.hidden = true;
    var out = document.getElementById("labOut");
    out.textContent = "";
    out.appendChild(el("div", { class: "feedback " + (score === c.max ? "good" : "bad"), text: (score === c.max ? "✅ Perfect! " : "You got " + score + " of " + c.max + ". ") + c.explain }));
    out.appendChild(el("div", { class: "row" }, [nextBtn()]));
  }

  // Open response (single box)
  function buildOpen(c, holder) {
    var ta = el("textarea", { id: "answerBox", placeholder: "Type your answer here…", "aria-label": "Your answer" });
    ta.value = state.texts[c.id] || "";
    holder.appendChild(ta);
    var sub = el("button", { class: "primary", id: "submitBtn", text: "Submit my answer", onclick: function () {
      if (ta.value.trim().length < 5) return;
      state.texts[c.id] = ta.value; state.submitted[c.id] = true; revealMaster(c);
    } });
    sub.disabled = ta.value.trim().length < 5;
    ta.addEventListener("input", function () { state.texts[c.id] = ta.value; sub.disabled = ta.value.trim().length < 5; });
    holder.appendChild(el("div", { class: "row", id: "submitRow" }, [sub]));
    holder.appendChild(el("div", { id: "afterSubmit" }));
    if (state.submitted[c.id]) revealMaster(c);
  }

  // Open response (several labeled boxes)
  function buildSteps(c, holder) {
    var vals = state.texts[c.id] = state.texts[c.id] || [];
    var tas = [];
    c.fields.forEach(function (f, i) {
      var id = "step_" + c.id + "_" + i;
      var lab = el("label", { class: "field", "for": id, text: f.label });
      if (f.help) lab.appendChild(el("span", { class: "fieldhelp", text: f.help }));
      holder.appendChild(lab);
      var ta = el("textarea", { id: id, placeholder: "Type here…" });
      ta.style.minHeight = "70px";
      ta.value = vals[i] || "";
      ta.addEventListener("input", function () { vals[i] = ta.value; check(); });
      tas.push(ta);
      holder.appendChild(ta);
    });
    var sub = el("button", { class: "primary", id: "submitBtn", text: "Submit my answers", onclick: function () {
      if (!ready()) return;
      state.submitted[c.id] = true; revealMaster(c);
    } });
    holder.appendChild(el("div", { class: "row", id: "submitRow" }, [sub]));
    holder.appendChild(el("div", { id: "afterSubmit" }));
    function ready() { return tas.every(function (t) { return t.value.trim().length >= 2; }); }
    function check() { sub.disabled = !ready(); }
    check();
    if (state.submitted[c.id]) revealMaster(c);
  }

  function revealMaster(c) {
    document.querySelectorAll("#cardBody textarea").forEach(function (t) { t.readOnly = true; });
    var row = document.getElementById("submitRow");
    if (row) row.hidden = true;
    var after = document.getElementById("afterSubmit");
    after.textContent = "";
    var box = el("div", { class: "master" }, [el("strong", { text: c.masterTitle || "🗝️ Master answer" })]);
    if (c.masterList) {
      var ul = el("ul");
      c.masterList.forEach(function (t) { ul.appendChild(el("li", { text: t })); });
      box.appendChild(ul);
    } else {
      box.appendChild(el("p", { text: c.master }));
    }
    box.appendChild(el("p", { class: "meta", text: "Compare it with your answer. You don’t need the same words, just the same big ideas." }));
    after.appendChild(box);
    after.appendChild(buildScoreBox(c));
  }

  function buildScoreBox(c) {
    var box = el("div", { class: "scorebox" });
    box.appendChild(el("p", { text: "Mr. Johnson awards points (0 to " + c.max + "):" }));
    var btns = el("div", { class: "scorebtns" });
    var current = Object.prototype.hasOwnProperty.call(state.pts, c.id) ? state.pts[c.id] : null;
    for (var p = 0; p <= c.max; p++) {
      (function (p) {
        var b = el("button", { text: String(p), "aria-label": p + " points", onclick: function () { setScore(c, p); } });
        if (current === p) b.classList.add("sel");
        btns.appendChild(b);
      })(p);
    }
    box.appendChild(btns);
    var lab = el("div", { class: "scorelabels" });
    lab.appendChild(el("span", { text: c.labels[0] }));
    lab.appendChild(el("span", { text: c.labels[c.labels.length - 1] }));
    box.appendChild(lab);
    var n = nextBtn("Next ▶");
    n.disabled = (current === null);
    box.appendChild(el("div", { class: "row" }, [n]));
    return box;
  }

  function setScore(c, p) {
    state.pts[c.id] = p;
    updateHud();
    document.querySelectorAll(".scorebtns button").forEach(function (b, i) { b.classList.toggle("sel", i === p); });
    var n = document.getElementById("nextBtn");
    if (n) n.disabled = false;
  }

  // Power-ups
  function useHint(c) {
    if (state.hintUsed && state.hintUsed !== c.id) return;
    state.hintUsed = c.id;
    state.hintShown[c.id] = true;
    showHintBox(c);
    updateHud();
  }
  function showHintBox(c) {
    var out = document.getElementById("toolOut");
    if (!out || document.getElementById("hintBox")) return;
    out.appendChild(el("div", { class: "hintbox", id: "hintBox" }, [
      el("strong", { text: "📜 The Historian whispers: " }),
      el("span", { text: c.hint })
    ]));
    var hb = document.getElementById("hintBtn");
    if (hb) hb.disabled = true;
  }

  function clearTimer() { if (state && state.timer) { clearInterval(state.timer); state.timer = null; } }

  function useRewind(c) {
    if (state.rewindUsed && state.rewindUsed !== c.id) return;
    state.rewindUsed = c.id;
    updateHud();
    var rb = document.getElementById("rewindBtn");
    if (rb) rb.disabled = true;
    var out = document.getElementById("toolOut");
    var old = document.getElementById("rewindBox");
    if (old) old.remove();
    var t = el("div", { class: "timer", text: "20" });
    out.insertBefore(el("div", { class: "hintbox", id: "rewindBox" }, [
      el("strong", { text: "🔄 Rewind! Flip back through your book and look for the answer." }), t
    ]), out.firstChild);
    var left = 20;
    clearTimer();
    state.timer = setInterval(function () {
      left -= 1;
      t.textContent = left > 0 ? String(left) : "Time’s up!";
      if (left <= 0) clearTimer();
    }, 1000);
  }

  // ---------- Final ----------
  function showFinal() {
    clearTimer();
    topbar.hidden = false; road.hidden = false;
    updateHud(true);
    stage.textContent = "";

    var mainTotal = 0;
    CARDS.forEach(function (c) { if (c.level <= 5 && state.pts[c.id]) mainTotal += state.pts[c.id]; });
    var pct = MAX_MAIN ? mainTotal / MAX_MAIN : 0;
    var rank, msg;
    if (pct >= 0.9) { rank = "👑 Emperor of Ideas"; msg = "Every province claimed. You know the chapter, you can separate story from argument, and you can weigh evidence like a historian."; }
    else if (pct >= 0.7) { rank = "🏛️ Senator"; msg = "Strong work. You’re following Harari’s argument closely and asking the right questions about his evidence."; }
    else if (pct >= 0.5) { rank = "⚔️ Provincial Governor"; msg = "You’ve claimed the main provinces. A few more to win over, and the road is yours."; }
    else { rank = "🛡️ Legion Recruit"; msg = "The march has begun! There’s more ground to cover, and we’ll cover it together."; }

    var tbody = el("tbody");
    [1, 2, 3, 4, 5].forEach(function (lv) {
      var got = 0, max = 0;
      CARDS.forEach(function (c) { if (c.level === lv) { max += c.max; got += (state.pts[c.id] || 0); } });
      tbody.appendChild(el("tr", null, [el("td", { text: LEVEL_INFO[lv].name + " · " + LEVEL_INFO[lv].sub }), el("td", { text: got + " / " + max })]));
    });
    var table = el("table", null, [
      el("thead", null, [el("tr", null, [el("th", { text: "Province" }), el("th", { text: "Points" })])]),
      tbody
    ]);
    var used = [
      state.rewindUsed ? "🔄 Rewind used on card " + state.rewindUsed : "🔄 Rewind not used",
      state.hintUsed ? "📜 Ask the Historian used on card " + state.hintUsed : "📜 Ask the Historian not used"
    ];

    var row = el("div", { class: "row" }, [
      el("button", { class: "ghost", text: "◀ Back to the last card", onclick: function () { state.idx = CARDS.length - 1; renderCard(); } }),
      resetControl("↺ Reset and play again")
    ]);
    stage.appendChild(el("section", { class: "card" }, [
      el("div", { class: "badge", text: "The road is complete" }),
      el("h2", { text: "Final Results" }),
      el("div", { class: "final-score", text: mainTotal + " / " + MAX_MAIN + " pts" }),
      el("div", { class: "rank", text: rank }),
      el("p", { class: "prompt", text: msg }),
      el("div", { class: "scroll" }, [table]),
      el("p", { class: "meta", text: used.join(" · ") }),
      el("div", { class: "hintbox" }, [el("strong", { text: "✍️ Up next: " }), el("span", { text: "Take your Boss Round answers and turn them into a full paragraph: topic sentence, evidence, analysis, then a rebuttal to your counterpoint and a merging sentence." })]),
      row
    ]));
    window.scrollTo(0, 0);
  }

  // ---------- Boot ----------
  showIntro();
})();
</script>

</body>
</html>
