<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sapiens Quest: The Great Wheat Heist</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #faf6ec;
    --surface: #ffffff;
    --surface-2: #f3ecd8;
    --text: #2a2418;
    --muted: #6b6250;
    --border: #e0d5b8;
    --accent: #b8731a;
    --accent-ink: #ffffff;
    --good: #2f7d4f;
    --good-bg: #e3f3e9;
    --bad: #b3402f;
    --bad-bg: #fbe7e3;
    --hint-bg: #fff3cf;
    --shadow: 0 2px 10px rgba(80, 60, 20, 0.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16130d;
      --surface: #211c13;
      --surface-2: #2c2518;
      --text: #f2ead6;
      --muted: #b3a88c;
      --border: #3d3422;
      --accent: #e0a040;
      --accent-ink: #1b1508;
      --good: #6fd197;
      --good-bg: #17301f;
      --bad: #f08a78;
      --bad-bg: #3a1c17;
      --hint-bg: #3a3014;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16130d; --surface: #211c13; --surface-2: #2c2518; --text: #f2ead6;
    --muted: #b3a88c; --border: #3d3422; --accent: #e0a040; --accent-ink: #1b1508;
    --good: #6fd197; --good-bg: #17301f; --bad: #f08a78; --bad-bg: #3a1c17;
    --hint-bg: #3a3014; --shadow: 0 2px 10px rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    line-height: 1.5; font-size: 17px;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 14px 16px 40px; }
  .stamp { text-align: right; font-size: 12.5px; font-style: italic; color: var(--muted); margin: 0 0 6px; }
  h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; line-height: 1.2; margin: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 0 14px; flex-wrap: wrap; }
  .score-pill { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 15px; box-shadow: var(--shadow); }
  .powerups { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .progress { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-bottom: 16px; border: 1px solid var(--border); }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width 0.4s ease; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
  .badge { display: inline-block; font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .card h2 { font-size: 25px; margin-bottom: 8px; }
  .prompt { font-size: 18px; margin: 10px 0 14px; }
  .meta { font-size: 14px; color: var(--muted); }
  .hero { text-align: center; padding: 8px 0 4px; }
  .hero .emoji { font-size: 54px; }
  .hero h1 { font-size: 34px; margin: 6px 0; }
  .rules { text-align: left; background: var(--surface-2); border-radius: 12px; padding: 12px 16px; margin: 16px 0; font-size: 15.5px; }
  .rules ul { margin: 6px 0 0; padding-left: 20px; }
  button { font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 10px 14px; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  button.ghost { background: transparent; }
  .opt { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 12px 14px; }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt.right { background: var(--good-bg); border-color: var(--good); color: var(--text); }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--text); }
  textarea { width: 100%; box-sizing: border-box; min-height: 92px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; resize: vertical; }
  textarea:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  label.field { display: block; font-weight: 700; font-size: 14.5px; margin: 12px 0 4px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .hintbox { background: var(--hint-bg); border-left: 5px solid var(--accent); border-radius: 8px; padding: 10px 12px; margin-top: 12px; font-size: 15.5px; }
  .feedback { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 15.5px; }
  .feedback.good { background: var(--good-bg); }
  .feedback.bad { background: var(--bad-bg); }
  .scorebox { margin-top: 16px; padding: 12px; border: 2px dashed var(--border); border-radius: 12px; }
  .scorebox p { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
  .scorebtns { display: flex; gap: 8px; flex-wrap: wrap; }
  .scorebtns button { min-width: 48px; font-weight: 700; }
  .scorebtns button.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .scorelabels { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .master { margin-top: 14px; background: var(--good-bg); border-left: 5px solid var(--good); border-radius: 8px; padding: 10px 14px; }
  .master p { margin: 6px 0 0; font-size: 16px; }
  .refresher { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin: 0 0 14px; font-size: 15.5px; }
  .refresher summary { cursor: pointer; font-weight: 700; }
  .refresher ul { margin: 8px 0 2px; padding-left: 20px; }
  .refresher li { margin: 4px 0; }
  .timer { font-size: 44px; font-weight: 800; text-align: center; color: var(--accent); }
  .final-score { font-size: 56px; font-weight: 800; text-align: center; color: var(--accent); margin: 4px 0; }
  .rank { text-align: center; font-family: Georgia, serif; font-size: 24px; margin-bottom: 10px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15.5px; margin: 10px 0; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; }
  .foot { margin-top: 22px; font-size: 12.5px; color: var(--muted); text-align: center; }
  @media (max-width: 480px) {
    body { font-size: 16px; }
    .hero h1 { font-size: 28px; }
    .card { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .progress > div { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <p class="stamp">Prepared with AI support, reviewed by Mr. Johnson</p>
  <div class="topbar" id="topbar" hidden>
    <div class="score-pill" id="scorePill">⭐ 0 pts</div>
    <div class="powerups" id="powerStatus"></div>
  </div>
  <div class="progress" id="progressWrap" hidden><div id="progressBar"></div></div>
  <main id="stage" aria-live="polite"></main>
  <p class="foot">Sapiens Quest · Chapter 5, “History’s Biggest Fraud” · A reading diagnostic game</p>
</div>

<script>
(function () {
  "use strict";

  // ---------- Content ----------
  var LABELS2 = ["Not yet", "Getting there", "Nailed it"];
  var CARDS = [
    // Level 1
    { id: "1A", level: 1, type: "mc", max: 1,
      title: "Card 1A · Roughly When?",
      prompt: "About how long ago did people start farming?",
      options: ["About 100,000 years ago", "About 10,000 years ago", "About 2,000 years ago", "About 500 years ago"],
      correct: 1,
      explain: "Around 10,000 years ago, in the hills of the Middle East. Farming also started on its own in a few other parts of the world.",
      hint: "Think thousands of years, not millions, and not hundreds." },
    { id: "1B", level: 1, type: "mc", max: 1,
      title: "Card 1B · The Suspect",
      prompt: "Harari names a surprising “culprit” behind the Agricultural Revolution. Who or what is it?",
      options: ["Greedy kings", "A plant: wheat", "Clever priests", "A volcanic eruption"],
      correct: 1,
      explain: "Wheat! Harari’s big twist is that wheat “domesticated” humans, not just the other way around.",
      hint: "It isn’t a person at all. Look at the very start of the chapter." },
    { id: "1C", level: 1, type: "mc", max: 1,
      title: "Card 1C · Name the Trap",
      prompt: "What does Harari call the trap where things meant to make life easier turn into burdens?",
      options: ["The luxury trap", "The progress paradox", "The surplus spiral", "The comfort curse"],
      correct: 0,
      explain: "The luxury trap: comforts and conveniences that slowly become obligations.",
      hint: "It’s a trap made of nice things." },
    { id: "1D", level: 1, type: "mc", max: 1,
      title: "Card 1D · The Temple Clue",
      prompt: "Which ancient stone site, built before farming, surprised archaeologists?",
      options: ["Stonehenge", "Göbekli Tepe", "The Great Pyramid of Giza", "Machu Picchu"],
      correct: 1,
      explain: "Göbekli Tepe, in Turkey. Its huge carved pillars came before farming, which hints that culture or religion may have pushed people to settle down.",
      hint: "It’s in modern-day Turkey, and it’s much older than the pyramids." },

    // Level 2
    { id: "2A", level: 2, type: "open", max: 2,
      title: "Card 2A · The One-Sentence Case File",
      prompt: "In ONE sentence, what is Harari’s main argument in this chapter?",
      hint: "A good answer has a gain AND a loss in it.",
      master: "Harari argues that the Agricultural Revolution was a trap: farming created more food and more people, but it made life harder for the average person than foraging had been. He calls it a “fraud” because people were promised an easier, safer life and got more work, a poorer diet and more danger instead. And nobody planned the trick on purpose.",
      labels: LABELS2 },
    { id: "2B", level: 2, type: "open", max: 2,
      title: "Card 2B · Who Won, Who Lost?",
      prompt: "Farming led to far MORE humans on Earth. So how can Harari still call it a bad deal?",
      hint: "Compare the whole species with one single person’s day.",
      master: "Because he measures success two different ways. For the species, farming was a win: more food meant many more humans. For individual people, it was a loss: longer, harder work, a narrower diet, a bigger risk of famine, and more fights over land. So the farmers themselves got scammed: a bigger crowd, but harder lives. (Farm animals follow the same pattern: huge numbers, but individual animals often live in misery.)",
      labels: LABELS2 },
    { id: "2C", level: 2, type: "open", max: 2,
      title: "Card 2C · Springing the Trap",
      prompt: "If farming was such a bad deal, why didn’t people just go back to foraging?",
      hint: "Think about how many people there were after a few generations.",
      master: "Because no one chose it all at once. People made small, sensible-seeming choices, like planting a little more and staying near the fields. More food meant more babies, and within a few generations there were too many people to live by foraging. Nobody remembered the old way of life, and comforts turned into necessities. That’s the luxury trap, and there was no way back.",
      labels: LABELS2 },

    // Level 3
    { id: "3B", level: 3, type: "open", max: 3,
      title: "Card 3 · The Chapter 3 Connection",
      prompt: "Imagine Chapter 3 turned out to be wrong, and foragers actually had it just as hard as farmers. Would Harari’s “fraud” argument in Chapter 5 still work? Why or why not?",
      refresher: [
        "Foragers ate a wide variety of foods: fruit, nuts, roots, mushrooms, insects, shellfish, honey, and meat now and then.",
        "Harari says foragers often worked only about 3 to 6 hours a day, which left lots of time for rest and play.",
        "He called forager life the “original affluent society.” Being well-off isn’t about owning lots of stuff. It’s about wanting little and being able to meet those wants easily.",
        "Foragers were often healthier than early farmers: a varied diet, small spread-out groups (so less disease), and less repetitive heavy labor.",
        "Early farmers lived in crowded villages, depended on one or two main crops, and worked longer, harder hours."
      ],
      hint: "“Worse” compared to what? Check the refresher for the comparison.",
      master: "It would be in trouble. “Worse” only means something when you compare it to something, and Harari’s comparison is the foragers from Chapter 3: healthier, with a varied diet and fewer work hours. If foragers had it just as hard, farming wouldn’t look like a step backward. It would just be a different way of life that happened to feed more people. So Chapter 5 leans on Chapter 3 being mostly right.",
      labels: ["Not yet", "Some reasoning", "Clear reasoning", "Sharp critic!"] },

    // Boss (four one-question steps)
    { id: "BOSS1", level: 4, type: "open", max: 1,
      title: "Boss Round · Step 1 of 4: The Verdict",
      prompt: "“Wheat domesticated us, not the other way around.” What’s your verdict: guilty, not guilty, or mostly guilty?",
      hint: "Any verdict works if you can back it up in the next steps.",
      master: "One strong verdict: “Mostly guilty.” Wheat spread across the whole planet because humans did all of its work, so in evolutionary terms wheat came out ahead. We just have to remember it’s a metaphor, since wheat can’t actually plan anything. (Any verdict is fine if you can defend it. This is just one model.)",
      labels: ["Not yet", "Got it!"] },
    { id: "BOSS2", level: 4, type: "open", max: 1,
      title: "Boss Round · Step 2 of 4: Evidence",
      prompt: "What is ONE reason from the chapter that supports Harari’s side?",
      hint: "Think about what humans had to do for wheat, and what it cost them.",
      master: "Humans spent their days clearing fields, pulling weeds, hauling water and guarding crops for wheat, while their own bodies, diets and freedom got worse. Meanwhile, wheat ended up growing across huge parts of the planet.",
      labels: ["Not yet", "Got it!"] },
    { id: "BOSS3", level: 4, type: "open", max: 1,
      title: "Boss Round · Step 3 of 4: Counterargument",
      prompt: "What is ONE point someone could use to argue against Harari?",
      hint: "Can wheat actually want anything? And what did farming make possible later?",
      master: "Wheat can’t want anything, and people chose to farm. Over thousands of years, farming also made cities, writing, science and modern medicine possible, so humans may have gained a lot in the long run.",
      labels: ["Not yet", "Got it!"] },
    { id: "BOSS4", level: 4, type: "open", max: 2,
      title: "Boss Round · Step 4 of 4: Rebuttal",
      prompt: "Does Harari’s case survive that counterargument? Why or why not?",
      hint: "Whose lives is Harari talking about, and when did those long-term benefits show up?",
      master: "Yes, but it gets narrower. Harari’s point is about the average farmer back then, and the long-term gains came far too late for those farmers. His case is weaker if you measure success over a much longer stretch of time. So the verdict depends on whose life, and how long, you’re counting.",
      labels: LABELS2 },

    // Bonus
    { id: "BONUS", level: 5, type: "open", max: 2, bonus: true,
      title: "Bonus Portal · Who Benefited?",
      prompt: "If farmers worked harder and ate worse, where did all the extra food go?",
      hint: "Think about who was NOT growing food but still had to eat. (This may come from the start of Chapter 6, so no worries if you haven’t reached it!)",
      master: "Much of it went to a small group who didn’t farm: rulers, soldiers, priests and other elites, who took the surplus from the peasants and used it to pay for palaces, temples and armies. (Chapter 6 picks this idea up.)",
      labels: ["Skip / not yet", "Getting there", "Bonus unlocked!"] }
  ];

  var LEVEL_INFO = {
    1: { name: "Level 1 · The Crime Scene", sub: "Recall Check" },
    2: { name: "Level 2 · Crack the Case", sub: "Comprehension Check" },
    3: { name: "Level 3 · Cross-Examine the Witness", sub: "Evaluation Check" },
    4: { name: "Boss Round", sub: "The Verdict" },
    5: { name: "Bonus Portal", sub: "Optional" }
  };

  var MAX_MAIN = 18;
  var BONUS_MAX = 2;

  // ---------- State ----------
  var state;
  function freshState() {
    return { idx: -1, pts: {}, answered: {}, submitted: {}, rewindUsed: null, hintUsed: null, hintShown: {}, mcPick: {}, texts: {}, timer: null, includeBonus: false };
  }
  state = freshState();

  var stage = document.getElementById("stage");
  var topbar = document.getElementById("topbar");
  var progWrap = document.getElementById("progressWrap");
  var progBar = document.getElementById("progressBar");
  var scorePill = document.getElementById("scorePill");
  var powerStatus = document.getElementById("powerStatus");

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  function totalPoints() {
    var t = 0;
    Object.keys(state.pts).forEach(function (k) { t += state.pts[k]; });
    return t;
  }

  function activeCards() {
    return CARDS.filter(function (c) { return !c.bonus || state.includeBonus; });
  }

  function updateHud() {
    scorePill.textContent = "⭐ " + totalPoints() + " pts";
    powerStatus.textContent = "";
    var r = el("span", { text: (state.rewindUsed ? "🔄 Rewind used" : "🔄 Rewind ready") });
    var h = el("span", { text: (state.hintUsed ? "📞 Phone a Forager used" : "📞 Phone a Forager ready") });
    powerStatus.appendChild(r);
    powerStatus.appendChild(h);
    var cards = activeCards();
    var done = Math.max(0, state.idx);
    progBar.style.width = Math.min(100, Math.round((done / cards.length) * 100)) + "%";
  }

  // ---------- Screens ----------
  function showIntro() {
    clearTimer();
    state = freshState();
    topbar.hidden = true; progWrap.hidden = true;
    stage.textContent = "";
    var rules = el("div", { class: "rules" }, [
      el("strong", { text: "How the game works" }),
      (function () {
        var ul = el("ul");
        [
          "Four rounds: The Crime Scene, Crack the Case, Cross-Examine the Witness, and a four-step Boss Round.",
          "You’ll get one question at a time. Level 1 is multiple choice and checks itself.",
          "For the other rounds, type your answer and press Submit. A master answer will appear so you can compare, and then Mr. Johnson awards the points.",
          "You get two one-time power-ups: 🔄 Rewind (20 seconds to look back in your book) and 📞 Phone a Forager (a small hint).",
          "There’s no penalty for using a power-up. They just help show where the trickiest ideas are."
        ].forEach(function (t) { ul.appendChild(el("li", { text: t })); });
        return ul;
      })()
    ]);
    var card = el("section", { class: "card" }, [
      el("div", { class: "hero" }, [
        el("div", { class: "emoji", text: "🕵️", "aria-hidden": "true" }),
        el("h1", { text: "The Great Wheat Heist" }),
        el("p", { class: "meta", text: "Sapiens Chapter 5: “History’s Biggest Fraud”" })
      ]),
      el("p", { class: "prompt", text: "Detective Brandon, Harari says someone pulled off the biggest scam in human history. Your mission: figure out who got scammed, who pulled it off, and whether Harari actually proves his case." }),
      rules,
      el("div", { class: "row" }, [
        el("button", { class: "primary", text: "Open the case file ▶", onclick: function () { state.idx = 0; renderCard(); } })
      ])
    ]);
    stage.appendChild(card);
    window.scrollTo(0, 0);
  }

  function renderCard() {
    clearTimer();
    var cards = activeCards();
    if (state.idx >= cards.length) { showFinal(); return; }
    var c = cards[state.idx];
    topbar.hidden = false; progWrap.hidden = false;
    updateHud();
    stage.textContent = "";

    var info = LEVEL_INFO[c.level];
    var card = el("section", { class: "card" }, [
      el("div", { class: "badge", text: info.name + " · " + info.sub }),
      el("h2", { text: c.title }),
      el("p", { class: "prompt", text: c.prompt })
    ]);

    var holder = el("div", { id: "cardBody" });
    card.appendChild(holder);

    if (c.type === "mc") buildMC(c, holder);
    else buildOpen(c, holder);

    var tools = el("div", { class: "row", id: "tools" });
    var rb = el("button", { class: "ghost", id: "rewindBtn", text: "🔄 Rewind", onclick: function () { useRewind(c); } });
    var hb = el("button", { class: "ghost", id: "hintBtn", text: "📞 Phone a Forager", onclick: function () { useHint(c); } });
    if (state.rewindUsed && state.rewindUsed !== c.id) rb.disabled = true;
    if (state.hintUsed && state.hintUsed !== c.id) hb.disabled = true;
    tools.appendChild(rb); tools.appendChild(hb);
    card.appendChild(tools);
    card.appendChild(el("div", { id: "toolOut" }));

    stage.appendChild(card);
    if (state.hintShown[c.id]) showHintBox(c);
    window.scrollTo(0, 0);
  }

  function nextBtn(label) {
    return el("button", { class: "primary", id: "nextBtn", text: label || "Next card ▶", onclick: function () { state.idx += 1; renderCard(); } });
  }

  // Multiple choice
  function buildMC(c, holder) {
    var list = el("div", { id: "opts" });
    c.options.forEach(function (o, i) {
      var b = el("button", { class: "opt", text: o, onclick: function () { pickMC(c, i); } });
      list.appendChild(b);
    });
    holder.appendChild(list);
    holder.appendChild(el("div", { id: "mcOut" }));
    if (state.answered[c.id]) restoreMC(c);
  }
  function pickMC(c, i) {
    if (state.answered[c.id]) return;
    state.answered[c.id] = true;
    state.mcPick[c.id] = i;
    state.pts[c.id] = (i === c.correct) ? c.max : 0;
    updateHud();
    restoreMC(c);
  }
  function restoreMC(c) {
    var btns = document.querySelectorAll("#opts .opt");
    var pick = state.mcPick[c.id];
    btns.forEach(function (b, i) {
      b.disabled = true;
      if (i === c.correct) b.classList.add("right");
      else if (i === pick) b.classList.add("wrong");
      b.style.opacity = "1";
    });
    var out = document.getElementById("mcOut");
    out.textContent = "";
    var ok = pick === c.correct;
    out.appendChild(el("div", { class: "feedback " + (ok ? "good" : "bad"), text: (ok ? "✅ Correct! +1. " : "❌ Not quite. ") + c.explain }));
    var r = el("div", { class: "row" }, [nextBtn()]);
    out.appendChild(r);
  }

  // Open response: type, submit, see master answer, tutor scores
  function buildOpen(c, holder) {
    if (c.refresher) {
      var det = el("details", { class: "refresher", open: "" });
      det.appendChild(el("summary", { text: "📚 Chapter 3 refresher (tap to open or close)" }));
      var ul = el("ul");
      c.refresher.forEach(function (t) { ul.appendChild(el("li", { text: t })); });
      det.appendChild(ul);
      holder.appendChild(det);
    }
    var ta = el("textarea", { id: "answerBox", placeholder: "Type your answer here…", "aria-label": "Your answer" });
    ta.value = state.texts[c.id] || "";
    holder.appendChild(ta);
    var after = el("div", { id: "afterSubmit" });
    var sub = el("button", { class: "primary", id: "submitBtn", text: "Submit my answer", onclick: function () { submitOpen(c); } });
    var row = el("div", { class: "row", id: "submitRow" }, [sub]);
    sub.disabled = (ta.value.trim().length < 5) && !state.submitted[c.id];
    ta.addEventListener("input", function () {
      state.texts[c.id] = ta.value;
      sub.disabled = ta.value.trim().length < 5;
    });
    holder.appendChild(row);
    holder.appendChild(after);
    if (state.submitted[c.id]) revealMaster(c);
  }

  function submitOpen(c) {
    var ta = document.getElementById("answerBox");
    if (!ta || ta.value.trim().length < 5) return;
    state.texts[c.id] = ta.value;
    state.submitted[c.id] = true;
    revealMaster(c);
  }

  function revealMaster(c) {
    var ta = document.getElementById("answerBox");
    if (ta) ta.readOnly = true;
    var row = document.getElementById("submitRow");
    if (row) row.hidden = true;
    var after = document.getElementById("afterSubmit");
    after.textContent = "";
    after.appendChild(el("div", { class: "master" }, [
      el("strong", { text: "🗝️ Master answer" }),
      el("p", { text: c.master }),
      el("p", { class: "meta", text: "Compare it with your answer. You don’t need the same words, just the same big ideas." })
    ]));
    after.appendChild(buildScoreBox(c));
  }

  function buildScoreBox(c) {
    var box = el("div", { class: "scorebox" });
    box.appendChild(el("p", { text: c.bonus ? "Mr. Johnson awards bonus points (0 to " + c.max + "):" : "Mr. Johnson awards points (0 to " + c.max + "):" }));
    var btns = el("div", { class: "scorebtns" });
    var current = state.pts.hasOwnProperty(c.id) ? state.pts[c.id] : null;
    for (var p = 0; p <= c.max; p++) {
      (function (p) {
        var b = el("button", { text: String(p), "aria-label": p + " points", onclick: function () { setScore(c, p); } });
        if (current === p) b.classList.add("sel");
        btns.appendChild(b);
      })(p);
    }
    box.appendChild(btns);
    var lab = el("div", { class: "scorelabels" });
    lab.appendChild(el("span", { text: c.labels[0] }));
    lab.appendChild(el("span", { text: c.labels[c.labels.length - 1] }));
    box.appendChild(lab);
    var row = el("div", { class: "row" }, [
      (function () {
        var n = nextBtn(c.bonus ? "See the results ▶" : "Next ▶");
        n.disabled = (current === null);
        return n;
      })()
    ]);
    box.appendChild(row);
    return box;
  }

  function setScore(c, p) {
    state.pts[c.id] = p;
    updateHud();
    var btns = document.querySelectorAll(".scorebtns button");
    btns.forEach(function (b, i) { b.classList.toggle("sel", i === p); });
    var n = document.getElementById("nextBtn");
    if (n) n.disabled = false;
  }

  // Power-ups
  function useHint(c) {
    if (state.hintUsed && state.hintUsed !== c.id) return;
    state.hintUsed = c.id;
    state.hintShown[c.id] = true;
    showHintBox(c);
    updateHud();
    var hb = document.getElementById("hintBtn");
    if (hb) hb.disabled = true;
  }
  function showHintBox(c) {
    var out = document.getElementById("toolOut");
    var existing = document.getElementById("hintBox");
    if (existing) return;
    var box = el("div", { class: "hintbox", id: "hintBox" }, [
      el("strong", { text: "📞 The Forager whispers: " }),
      el("span", { text: c.hint })
    ]);
    out.appendChild(box);
    var hb = document.getElementById("hintBtn");
    if (hb) hb.disabled = true;
  }

  function clearTimer() { if (state.timer) { clearInterval(state.timer); state.timer = null; } }

  function useRewind(c) {
    if (state.rewindUsed && state.rewindUsed !== c.id) return;
    state.rewindUsed = c.id;
    updateHud();
    var rb = document.getElementById("rewindBtn");
    if (rb) rb.disabled = true;
    var out = document.getElementById("toolOut");
    var old = document.getElementById("rewindBox");
    if (old) old.remove();
    var t = el("div", { class: "timer", id: "rewindTime", text: "20" });
    var box = el("div", { class: "hintbox", id: "rewindBox" }, [
      el("strong", { text: "🔄 Rewind! Flip back through your book and look for the answer." }),
      t
    ]);
    out.insertBefore(box, out.firstChild);
    var left = 20;
    clearTimer();
    state.timer = setInterval(function () {
      left -= 1;
      t.textContent = left > 0 ? String(left) : "Time’s up!";
      if (left <= 0) clearTimer();
    }, 1000);
  }

  // ---------- Final ----------
  function showFinal() {
    clearTimer();
    topbar.hidden = false; progWrap.hidden = false;
    progBar.style.width = "100%";
    updateHud();
    stage.textContent = "";

    var total = totalPoints();
    var mainTotal = 0;
    CARDS.forEach(function (c) { if (!c.bonus && state.pts[c.id]) mainTotal += state.pts[c.id]; });
    var pct = mainTotal / MAX_MAIN;
    var rank, msg;
    if (pct >= 0.9) { rank = "🏆 Chief Inspector of History"; msg = "Case closed, and in style. You handled the facts, the big idea, and the arguing."; }
    else if (pct >= 0.7) { rank = "🔎 Senior Detective"; msg = "Strong work. You’re tracking Harari’s argument and judging it, which is the hard part."; }
    else if (pct >= 0.5) { rank = "🕵️ Junior Detective"; msg = "You’ve got the main clues. A few more to chase down, and you’ll crack the whole case."; }
    else { rank = "🧭 Rookie Sleuth"; msg = "The case is still open! That just means there’s more to uncover. Let’s dig into it together."; }

    var perLevel = [1, 2, 3, 4].map(function (lv) {
      var got = 0, max = 0;
      CARDS.forEach(function (c) { if (c.level === lv) { max += c.max; got += (state.pts[c.id] || 0); } });
      return [LEVEL_INFO[lv].name, got, max];
    });

    var tbody = el("tbody");
    perLevel.forEach(function (r) {
      tbody.appendChild(el("tr", null, [el("td", { text: r[0] }), el("td", { text: r[1] + " / " + r[2] })]));
    });
    if (state.includeBonus) {
      tbody.appendChild(el("tr", null, [el("td", { text: "Bonus Portal" }), el("td", { text: (state.pts.BONUS || 0) + " / " + BONUS_MAX })]));
    }
    var table = el("table", null, [
      el("thead", null, [el("tr", null, [el("th", { text: "Round" }), el("th", { text: "Points" })])]),
      tbody
    ]);

    var used = [];
    used.push(state.rewindUsed ? "🔄 Rewind used on card " + state.rewindUsed : "🔄 Rewind not used");
    used.push(state.hintUsed ? "📞 Phone a Forager used on card " + state.hintUsed : "📞 Phone a Forager not used");

    var card = el("section", { class: "card" }, [
      el("div", { class: "badge", text: "Case closed" }),
      el("h2", { text: "Final Results" }),
      el("div", { class: "final-score", text: total + " pts" }),
      el("div", { class: "rank", text: rank }),
      el("p", { class: "prompt", text: msg }),
      el("div", { class: "scroll" }, [table]),
      el("p", { class: "meta", text: used.join(" · ") }),
      el("div", { class: "row" }, [])
    ]);
    var row = card.lastChild;
    if (!state.includeBonus) {
      row.appendChild(el("button", { text: "🌀 Try the Bonus Portal", onclick: function () { state.includeBonus = true; state.idx = activeCards().length - 1; renderCard(); } }));
    }
    row.appendChild(el("button", { class: "primary", text: "↺ Play again", onclick: showIntro }));
    stage.appendChild(card);
    window.scrollTo(0, 0);
  }

  showIntro();
})();
</script>
</body>
</html>
