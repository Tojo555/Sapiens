<!DOCTYPE html>

<head>

<title>Sapiens Quest: The Pyramid Quest</title>
<style>

      --good: #6fd197;

      --bad: #f08a78;

      --hint-bg: #3a3014;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.5);

  :root[data-theme="dark"] {
    --bg: #16130d; --surface: #211c13; --surface-2: #2c2518; --text: #f2ead6;

    --good: #6fd197; --good-bg: #17301f; --bad: #f08a78; --bad-bg: #3a1c17;
    --hint-bg: #3a3014; --shadow: 0 2px 10px rgba(0, 0, 0, 0.5); color-scheme: dark;

  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100%; background: var(--bg); color: var(--text);

  .wrap { max-width: 720px; margin: 0 auto; padding: 14px 16px 40px; }

  .powerups { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .progress { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-bottom: 16px; border: 1px solid var(--border); }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width 0.4s ease; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
  .badge { display: inline-block; font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .card h2 { font-size: 25px; margin-bottom: 8px; }
  .prompt { font-size: 18px; margin: 10px 0 14px; }
  .meta { font-size: 14px; color: var(--muted); }
  .hero { text-align: center; padding: 8px 0 4px; }
  .hero .emoji { font-size: 54px; }
  .hero h1 { font-size: 34px; margin: 6px 0; }
  .rules { text-align: left; background: var(--surface-2); border-radius: 12px; padding: 12px 16px; margin: 16px 0; font-size: 15.5px; }
  .rules ul { margin: 6px 0 0; padding-left: 20px; }
  button { font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 10px 14px; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  button.ghost { background: transparent; }
  .opt { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 12px 14px; }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt.right { background: var(--good-bg); border-color: var(--good); color: var(--text); }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--text); }
  textarea { width: 100%; box-sizing: border-box; min-height: 92px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; resize: vertical; }
  textarea:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  label.field { display: block; font-weight: 700; font-size: 14.5px; margin: 12px 0 4px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .hintbox { background: var(--hint-bg); border-left: 5px solid var(--accent); border-radius: 8px; padding: 10px 12px; margin-top: 12px; font-size: 15.5px; }
  .feedback { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 15.5px; }
  .feedback.good { background: var(--good-bg); }
  .feedback.bad { background: var(--bad-bg); }
  .scorebox { margin-top: 16px; padding: 12px; border: 2px dashed var(--border); border-radius: 12px; }
  .scorebox p { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
  .scorebtns { display: flex; gap: 8px; flex-wrap: wrap; }
  .scorebtns button { min-width: 48px; font-weight: 700; }
  .scorebtns button.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .scorelabels { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .master { margin-top: 14px; background: var(--good-bg); border-left: 5px solid var(--good); border-radius: 8px; padding: 10px 14px; }
  .master p { margin: 6px 0 0; font-size: 16px; }
  .refresher { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin: 0 0 14px; font-size: 15.5px; }
  .refresher summary { cursor: pointer; font-weight: 700; }
  .refresher ul { margin: 8px 0 2px; padding-left: 20px; }
  .refresher li { margin: 4px 0; }
  .timer { font-size: 44px; font-weight: 800; text-align: center; color: var(--accent); }
  .final-score { font-size: 56px; font-weight: 800; text-align: center; color: var(--accent); margin: 4px 0; }
  .rank { text-align: center; font-family: Georgia, serif; font-size: 24px; margin-bottom: 10px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15.5px; margin: 10px 0; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; }
  .sent { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin: 10px 0; background: var(--bg); }
  .sent p { margin: 0 0 8px; font-size: 16.5px; }
  .labbtns { display: flex; gap: 6px; flex-wrap: wrap; }
  .labbtns button { padding: 6px 10px; font-size: 14px; }
  .labbtns button.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .labbtns button.right { background: var(--good-bg); border-color: var(--good); color: var(--text); font-weight: 700; opacity: 1; }
  .labbtns button.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--text); opacity: 1; }
  .opt.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .foot { margin-top: 22px; font-size: 12.5px; color: var(--muted); text-align: center; }
  @media (max-width: 480px) {
    body { font-size: 16px; }
    .hero h1 { font-size: 28px; }
    .card { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .progress > div { transition: none; } }
</style>
</head>

    // Level 2: the climb (easier to harder)
    { id: "2A", level: 2, type: "mc", max: 1,

    { id: "2E", level: 2, type: "mc", max: 1,

    // Level 3: written
    { id: "3A", level: 3, type: "open", max: 2,

      master: "Pyramids stand for huge projects that only happen when thousands of strangers cooperate. Nobody can build one alone, and Harari says force alone isn’t enough. The builders and the elites shared an imagined order, with beliefs about pharaohs, gods and the afterlife. Those beliefs even shaped what the rich wanted: they poured their wealth into tombs, the way people today pour theirs into things like shopping and vacations. So “building pyramids” points to Harari’s big idea: shared beliefs are what let large societies do large things.",

    // Level 4: Prison Walls
    { id: "W1", level: 4, type: "multi", max: 3, pick: 3,

      prompt: "Harari says an imagined order is protected by invisible “walls” that keep us from noticing it’s imagined. Which THREE of these are the ways the walls are reinforced? Pick exactly three, then check.",
      options: [

      hint: "Think about three places a belief could hide: in the things around you, in what you want, and in what everyone else believes." },

    { id: "W2", level: 4, type: "open", max: 2,

      master: "The modern ideal of individualism is an imagined order: it says each person is a unique individual who needs privacy and a space of their own. That belief gets built into walls and doors, with a separate room for each child. Because we grow up living inside houses like that, the belief stops feeling like an idea and starts feeling like plain reality. Nobody has to argue for individualism; the building does it quietly every day. (In many times and places, families lived and slept together in shared spaces.)",

      master: "Each society’s shared beliefs taught people what the best life looks like. The Egyptians believed the afterlife mattered most, so the rich wanted grand tombs. Today’s beliefs, which Harari calls romanticism (have as many experiences as you can) and consumerism (buy things to be happy), teach us to want things like vacations abroad. The wants feel personal, but they came from the beliefs around us. That is how an imagined order shapes our desires, and why we rarely notice it.",

    { id: "W6", level: 4, type: "open", max: 2,
      title: "Prison Walls · Card 4 · Wall 3: Shared by Millions",
      prompt: "Harari calls imagined orders “intersubjective,” meaning they exist in the shared beliefs of many people. Use the dollar (or any example): why can’t one person just decide to stop believing and escape the order?",
      hint: "Think about something you can’t change by yourself, like what money is worth. Why not?",
      master: "Because the order doesn’t live in one person’s head; it lives in the shared beliefs of millions of people and the ways they communicate. If you stop believing in the dollar, a store still won’t take your imaginary payment, so nothing changes. It isn’t objective (real whether or not anyone believes) and it isn’t just subjective (one mind). To change an intersubjective order, millions of people have to change their minds together, which is very hard, and that is part of why the wall holds.",

      sentences: [

      hint: "Try three tests: Would it still be true if every human disappeared? If just one person changed their mind? If millions changed their minds together?" },

  ];

  var LEVEL_INFO = {
    1: { name: "Level 1 · Foundation Stones", sub: "Warm-up" },
    2: { name: "Level 2 · Climb the Steps", sub: "Easier to Harder" },
    3: { name: "Level 3 · Raise the Walls", sub: "Comprehension Check" },
    4: { name: "Level 4 · The Prison Walls", sub: "Section Reinforcement" },
    5: { name: "Level 5 · Three Kinds of Real", sub: "Objective, Subjective, Intersubjective" },
    6: { name: "Looking Ahead · The Scent of Money", sub: "Setting Up the Next Reading" }
  };

  var MAX_MAIN = 27;
  var BONUS_MAX = 2;

  // ---------- State ----------
  var state;
  function freshState() {
    return { idx: -1, pts: {}, answered: {}, submitted: {}, rewindUsed: null, hintUsed: null, hintShown: {}, mcPick: {}, labPick: {}, multiPick: {}, texts: {}, timer: null, includeBonus: false };
  }
  state = freshState();

  var stage = document.getElementById("stage");
  var topbar = document.getElementById("topbar");
  var progWrap = document.getElementById("progressWrap");
  var progBar = document.getElementById("progressBar");
  var scorePill = document.getElementById("scorePill");
  var powerStatus = document.getElementById("powerStatus");

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  function totalPoints() {
    var t = 0;
    Object.keys(state.pts).forEach(function (k) { t += state.pts[k]; });
    return t;
  }

  function activeCards() {
    return CARDS.filter(function (c) { return !c.bonus || state.includeBonus; });
  }

  function updateHud() {
    scorePill.textContent = "⭐ " + totalPoints() + " pts";
    powerStatus.textContent = "";
    var r = el("span", { text: (state.rewindUsed ? "🔄 Rewind used" : "🔄 Rewind ready") });
    var h = el("span", { text: (state.hintUsed ? "📜 Ask the Scribe used" : "📜 Ask the Scribe ready") });
    powerStatus.appendChild(r);
    powerStatus.appendChild(h);
    var cards = activeCards();
    var done = Math.max(0, state.idx);
    progBar.style.width = Math.min(100, Math.round((done / cards.length) * 100)) + "%";
  }

  // ---------- Screens ----------
  function showIntro() {
    clearTimer();
    state = freshState();
    topbar.hidden = true; progWrap.hidden = true;
    stage.textContent = "";
    var rules = el("div", { class: "rules" }, [
      el("strong", { text: "How the game works" }),
      (function () {
        var ul = el("ul");
        [
          "Five scored rounds: Foundation Stones, Climb the Steps (five multiple-choice questions that get harder), Raise the Walls, the Prison Walls, and Three Kinds of Real. A final Looking Ahead round has no points and sets up your next reading.",
          "Multiple-choice cards check themselves.",
          "For the written cards, type your answer and press Submit. A master answer will appear so you can compare, and then Mr. Johnson awards the points.",
          "You get two one-time power-ups: 🔄 Rewind (20 seconds to look back in your book) and 📜 Ask the Scribe (a small hint).",
          "There’s no penalty for using a power-up. They just help show where the trickiest ideas are."
        ].forEach(function (t) { ul.appendChild(el("li", { text: t })); });
        return ul;
      })()
    ]);
    var card = el("section", { class: "card" }, [
      el("div", { class: "hero" }, [
        el("div", { class: "emoji", text: "🏺", "aria-hidden": "true" }),
        el("h1", { text: "The Pyramid Quest" }),
        el("p", { class: "meta", text: "Sapiens Chapter 6: “Building Pyramids”" })
      ]),
      el("p", { class: "prompt", text: "Welcome, builder! Pharaoh needs someone who really understands what holds a pyramid together. Your mission: show what Harari means by “building pyramids,” and prove you can take a paragraph apart like a pro." }),
      rules,
      el("div", { class: "row" }, [
        el("button", { class: "primary", text: "Start building ▶", onclick: function () { state.idx = 0; renderCard(); } })
      ])
    ]);
    stage.appendChild(card);
    window.scrollTo(0, 0);
  }

  function renderCard() {
    clearTimer();
    var cards = activeCards();
    if (state.idx >= cards.length) { showFinal(); return; }
    var c = cards[state.idx];
    topbar.hidden = false; progWrap.hidden = false;
    updateHud();
    stage.textContent = "";

    var info = LEVEL_INFO[c.level];
    var card = el("section", { class: "card" }, [
      el("div", { class: "badge", text: info.name + " · " + info.sub }),
      el("h2", { text: c.title }),
      el("p", { class: "prompt", text: c.prompt })
    ]);

    var holder = el("div", { id: "cardBody" });
    card.appendChild(holder);

    if (c.type === "mc") buildMC(c, holder);
    else if (c.type === "label") buildLabel(c, holder);
    else if (c.type === "multi") buildMulti(c, holder);
    else if (c.type === "think") buildThink(c, holder);
    else buildOpen(c, holder);

    var tools = el("div", { class: "row", id: "tools" });
    var rb = el("button", { class: "ghost", id: "rewindBtn", text: "🔄 Rewind", onclick: function () { useRewind(c); } });
    var hb = el("button", { class: "ghost", id: "hintBtn", text: "📜 Ask the Scribe", onclick: function () { useHint(c); } });
    if (state.rewindUsed && state.rewindUsed !== c.id) rb.disabled = true;
    if (state.hintUsed && state.hintUsed !== c.id) hb.disabled = true;
    tools.appendChild(rb); tools.appendChild(hb);
    card.appendChild(tools);
    card.appendChild(el("div", { id: "toolOut" }));

    stage.appendChild(card);
    if (state.hintShown[c.id]) showHintBox(c);
    window.scrollTo(0, 0);
  }

  function nextBtn(label) {
    return el("button", { class: "primary", id: "nextBtn", text: label || "Next card ▶", onclick: function () { state.idx += 1; renderCard(); } });
  }

  // Multiple choice
  function buildMC(c, holder) {
    var list = el("div", { id: "opts" });
    c.options.forEach(function (o, i) {
      var b = el("button", { class: "opt", text: o, onclick: function () { pickMC(c, i); } });
      list.appendChild(b);
    });
    holder.appendChild(list);
    holder.appendChild(el("div", { id: "mcOut" }));
    if (state.answered[c.id]) restoreMC(c);
  }
  function pickMC(c, i) {
    if (state.answered[c.id]) return;
    state.answered[c.id] = true;
    state.mcPick[c.id] = i;
    state.pts[c.id] = (i === c.correct) ? c.max : 0;
    updateHud();
    restoreMC(c);
  }
  function restoreMC(c) {
    var btns = document.querySelectorAll("#opts .opt");
    var pick = state.mcPick[c.id];
    btns.forEach(function (b, i) {
      b.disabled = true;
      if (i === c.correct) b.classList.add("right");
      else if (i === pick) b.classList.add("wrong");
      b.style.opacity = "1";
    });
    var out = document.getElementById("mcOut");
    out.textContent = "";
    var ok = pick === c.correct;
    out.appendChild(el("div", { class: "feedback " + (ok ? "good" : "bad"), text: (ok ? "✅ Correct! +1. " : "❌ Not quite. ") + c.explain }));
    var r = el("div", { class: "row" }, [nextBtn()]);
    out.appendChild(r);
  }

  // Discussion card (no points)
  function buildThink(c, holder) {
    if (c.items) {
      var ul = el("ul");
      c.items.forEach(function (t) { ul.appendChild(el("li", { text: t })); });
      holder.appendChild(ul);
    }
    if (c.master) {
      var box = el("div", { class: "feedback good", id: "masterBox", text: "💡 Model answer: " + c.master });
      box.hidden = !state.answered[c.id];
      var rv = el("button", { class: "ghost", text: "💡 Show a model answer", onclick: function () {
        state.answered[c.id] = true; box.hidden = false; rv.hidden = true;
      } });
      rv.hidden = !box.hidden;
      holder.appendChild(el("div", { class: "row" }, [rv]));
      holder.appendChild(box);
    }
    var isLast = state.idx >= activeCards().length - 1;
    holder.appendChild(el("div", { class: "row" }, [nextBtn(isLast ? "See the results ▶" : "Next ▶")]));
  }

  // Multi-select card
  function buildMulti(c, holder) {
    var picks = state.multiPick[c.id] = state.multiPick[c.id] || [];
    holder.appendChild(el("p", { class: "meta", text: "Pick exactly " + c.pick + "." }));
    var list = el("div", { id: "opts" });
    var btns = [];
    c.options.forEach(function (o, i) {
      var b = el("button", { class: "opt", text: o, "aria-pressed": "false", onclick: function () {
        if (state.answered[c.id]) return;
        var k = picks.indexOf(i);
        if (k >= 0) picks.splice(k, 1);
        else if (picks.length < c.pick) picks.push(i);
        refresh();
      } });
      btns.push(b); list.appendChild(b);
    });
    holder.appendChild(list);
    var chk = el("button", { class: "primary", text: "Check my picks", onclick: function () { checkMulti(c, btns, picks); } });
    var chkRow = el("div", { class: "row", id: "multiCheckRow" }, [chk]);
    holder.appendChild(chkRow);
    holder.appendChild(el("div", { id: "multiOut" }));
    function refresh() {
      btns.forEach(function (b, i) {
        var on = picks.indexOf(i) >= 0;
        b.classList.toggle("sel", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
      chk.disabled = picks.length !== c.pick;
    }
    refresh();
    if (state.answered[c.id]) checkMulti(c, btns, picks);
  }
  function checkMulti(c, btns, picks) {
    var score = 0;
    picks.forEach(function (i) { if (c.correct.indexOf(i) >= 0) score++; });
    btns.forEach(function (b, i) {
      b.disabled = true;
      b.classList.remove("sel");
      b.style.opacity = "1";
      if (c.correct.indexOf(i) >= 0) b.classList.add("right");
      else if (picks.indexOf(i) >= 0) b.classList.add("wrong");
    });
    state.answered[c.id] = true;
    state.pts[c.id] = score;
    updateHud();
    var cr = document.getElementById("multiCheckRow");
    if (cr) cr.hidden = true;
    var out = document.getElementById("multiOut");
    out.textContent = "";
    out.appendChild(el("div", { class: "feedback " + (score === c.max ? "good" : "bad"), text: (score === c.max ? "✅ All three! " : "You found " + score + " of " + c.max + ". ") + c.explain }));
    out.appendChild(el("div", { class: "row" }, [nextBtn()]));
  }

  // Paragraph labeler
  function buildLabel(c, holder) {
    var picks = state.labPick[c.id] = state.labPick[c.id] || [];
    var det = el("details", { class: "refresher", open: "" });
    det.appendChild(el("summary", { text: c.refresherTitle }));
    var ul = el("ul");
    c.refresher.forEach(function (t) { ul.appendChild(el("li", { text: t })); });
    det.appendChild(ul);
    holder.appendChild(det);

    var rows = [];
    c.sentences.forEach(function (s, i) {
      var row = el("div", { class: "sent" });
      row.appendChild(el("p", { text: (i + 1) + ". " + s.text }));
      var bw = el("div", { class: "labbtns" });
      var btns = [];
      c.choices.forEach(function (ch, j) {
        var b = el("button", { text: ch, "aria-pressed": "false", onclick: function () {
          if (state.answered[c.id]) return;
          picks[i] = j; refresh();
        } });
        btns.push(b); bw.appendChild(b);
      });
      row.appendChild(bw);
      rows.push(btns);
      holder.appendChild(row);
    });

    var out = el("div", { id: "labOut" });
    var chk = el("button", { class: "primary", id: "checkBtn", text: "Check my labels", onclick: function () { checkLabels(c, rows, picks); } });
    var chkRow = el("div", { class: "row", id: "checkRow" }, [chk]);
    holder.appendChild(chkRow);
    holder.appendChild(out);

    function picked() { var n = 0; for (var k = 0; k < c.sentences.length; k++) if (picks[k] !== undefined) n++; return n; }
    function refresh() {
      rows.forEach(function (btns, i) {
        btns.forEach(function (b, j) {
          var on = picks[i] === j;
          b.classList.toggle("sel", on);
          b.setAttribute("aria-pressed", on ? "true" : "false");
        });
      });
      chk.disabled = picked() < c.sentences.length;
    }
    refresh();
    if (state.answered[c.id]) checkLabels(c, rows, picks);
  }
  function checkLabels(c, rows, picks) {
    var score = 0;
    rows.forEach(function (btns, i) {
      var good = c.sentences[i].correct;
      if (picks[i] === good) score++;
      btns.forEach(function (b, j) {
        b.disabled = true;
        b.classList.remove("sel");
        if (j === good) b.classList.add("right");
        else if (j === picks[i]) b.classList.add("wrong");
      });
    });
    state.answered[c.id] = true;
    state.pts[c.id] = score;
    updateHud();
    var cr = document.getElementById("checkRow");
    if (cr) cr.hidden = true;
    var out = document.getElementById("labOut");
    out.textContent = "";
    out.appendChild(el("div", { class: "feedback " + (score === c.max ? "good" : "bad"), text: (score === c.max ? "✅ Perfect! " : "You got " + score + " of " + c.max + ". ") + c.explain }));
    out.appendChild(el("div", { class: "row" }, [nextBtn()]));
  }

  // Open response: type, submit, see master answer, tutor scores
  function buildOpen(c, holder) {
    if (c.refresher) {
      var det = el("details", { class: "refresher", open: "" });
      det.appendChild(el("summary", { text: c.refresherTitle || "📚 Refresher (tap to open or close)" }));
      var ul = el("ul");
      c.refresher.forEach(function (t) { ul.appendChild(el("li", { text: t })); });
      det.appendChild(ul);
      holder.appendChild(det);
    }
    var ta = el("textarea", { id: "answerBox", placeholder: "Type your answer here…", "aria-label": "Your answer" });
    ta.value = state.texts[c.id] || "";
    holder.appendChild(ta);
    var after = el("div", { id: "afterSubmit" });
    var sub = el("button", { class: "primary", id: "submitBtn", text: "Submit my answer", onclick: function () { submitOpen(c); } });
    var row = el("div", { class: "row", id: "submitRow" }, [sub]);
    sub.disabled = (ta.value.trim().length < 5) && !state.submitted[c.id];
    ta.addEventListener("input", function () {
      state.texts[c.id] = ta.value;
      sub.disabled = ta.value.trim().length < 5;
    });
    holder.appendChild(row);
    holder.appendChild(after);
    if (state.submitted[c.id]) revealMaster(c);
  }

  function submitOpen(c) {
    var ta = document.getElementById("answerBox");
    if (!ta || ta.value.trim().length < 5) return;
    state.texts[c.id] = ta.value;
    state.submitted[c.id] = true;
    revealMaster(c);
  }

  function revealMaster(c) {
    var ta = document.getElementById("answerBox");
    if (ta) ta.readOnly = true;
    var row = document.getElementById("submitRow");
    if (row) row.hidden = true;
    var after = document.getElementById("afterSubmit");
    after.textContent = "";
    after.appendChild(el("div", { class: "master" }, [
      el("strong", { text: "🗝️ Master answer" }),
      el("p", { text: c.master }),
      el("p", { class: "meta", text: "Compare it with your answer. You don’t need the same words, just the same big ideas." })
    ]));
    after.appendChild(buildScoreBox(c));
  }

  function buildScoreBox(c) {
    var box = el("div", { class: "scorebox" });
    box.appendChild(el("p", { text: c.bonus ? "Mr. Johnson awards bonus points (0 to " + c.max + "):" : "Mr. Johnson awards points (0 to " + c.max + "):" }));
    var btns = el("div", { class: "scorebtns" });
    var current = state.pts.hasOwnProperty(c.id) ? state.pts[c.id] : null;
    for (var p = 0; p <= c.max; p++) {
      (function (p) {
        var b = el("button", { text: String(p), "aria-label": p + " points", onclick: function () { setScore(c, p); } });
        if (current === p) b.classList.add("sel");
        btns.appendChild(b);
      })(p);
    }
    box.appendChild(btns);
    var lab = el("div", { class: "scorelabels" });
    lab.appendChild(el("span", { text: c.labels[0] }));
    lab.appendChild(el("span", { text: c.labels[c.labels.length - 1] }));
    box.appendChild(lab);
    var row = el("div", { class: "row" }, [
      (function () {
        var n = nextBtn(c.bonus ? "See the results ▶" : "Next ▶");
        n.disabled = (current === null);
        return n;
      })()
    ]);
    box.appendChild(row);
    return box;
  }

  function setScore(c, p) {
    state.pts[c.id] = p;
    updateHud();
    var btns = document.querySelectorAll(".scorebtns button");
    btns.forEach(function (b, i) { b.classList.toggle("sel", i === p); });
    var n = document.getElementById("nextBtn");
    if (n) n.disabled = false;
  }

  // Power-ups
  function useHint(c) {
    if (state.hintUsed && state.hintUsed !== c.id) return;
    state.hintUsed = c.id;
    state.hintShown[c.id] = true;
    showHintBox(c);
    updateHud();
    var hb = document.getElementById("hintBtn");
    if (hb) hb.disabled = true;
  }
  function showHintBox(c) {
    var out = document.getElementById("toolOut");
    var existing = document.getElementById("hintBox");
    if (existing) return;
    var box = el("div", { class: "hintbox", id: "hintBox" }, [
      el("strong", { text: "📜 The Scribe whispers: " }),
      el("span", { text: c.hint })
    ]);
    out.appendChild(box);
    var hb = document.getElementById("hintBtn");
    if (hb) hb.disabled = true;
  }

  function clearTimer() { if (state.timer) { clearInterval(state.timer); state.timer = null; } }

  function useRewind(c) {
    if (state.rewindUsed && state.rewindUsed !== c.id) return;
    state.rewindUsed = c.id;
    updateHud();
    var rb = document.getElementById("rewindBtn");
    if (rb) rb.disabled = true;
    var out = document.getElementById("toolOut");
    var old = document.getElementById("rewindBox");
    if (old) old.remove();
    var t = el("div", { class: "timer", id: "rewindTime", text: "20" });
    var box = el("div", { class: "hintbox", id: "rewindBox" }, [
      el("strong", { text: "🔄 Rewind! Flip back through your book and look for the answer." }),
      t
    ]);
    out.insertBefore(box, out.firstChild);
    var left = 20;
    clearTimer();
    state.timer = setInterval(function () {
      left -= 1;
      t.textContent = left > 0 ? String(left) : "Time’s up!";
      if (left <= 0) clearTimer();
    }, 1000);
  }

  // ---------- Final ----------
  function showFinal() {
    clearTimer();
    topbar.hidden = false; progWrap.hidden = false;
    progBar.style.width = "100%";
    updateHud();
    stage.textContent = "";

    var total = totalPoints();
    var mainTotal = 0;
    CARDS.forEach(function (c) { if (!c.bonus && state.pts[c.id]) mainTotal += state.pts[c.id]; });
    var pct = mainTotal / MAX_MAIN;
    var rank, msg;
    if (pct >= 0.9) { rank = "👑 Pharaoh of Ideas"; msg = "The pyramid is complete, and in style. You handled the facts, the big idea, and the paragraph analysis."; }
    else if (pct >= 0.7) { rank = "🏛️ Royal Scribe"; msg = "Strong work. You’re following Harari’s argument and reading paragraphs closely."; }
    else if (pct >= 0.5) { rank = "🧱 Master Builder"; msg = "You’ve laid the main stones. A few more to place, and the pyramid will stand."; }
    else { rank = "🪨 Stone-Hauler"; msg = "The pyramid is still going up! That just means there’s more to build. Let’s work on it together."; }

    var perLevel = [1, 2, 3, 4, 5].map(function (lv) {
      var got = 0, max = 0;
      CARDS.forEach(function (c) { if (c.level === lv) { max += c.max; got += (state.pts[c.id] || 0); } });
      return [LEVEL_INFO[lv].name, got, max];
    });

    var tbody = el("tbody");
    perLevel.forEach(function (r) {
      tbody.appendChild(el("tr", null, [el("td", { text: r[0] }), el("td", { text: r[1] + " / " + r[2] })]));
    });
    if (state.includeBonus) {
      tbody.appendChild(el("tr", null, [el("td", { text: "Bonus Portal" }), el("td", { text: (state.pts.BONUS || 0) + " / " + BONUS_MAX })]));
    }
    var table = el("table", null, [
      el("thead", null, [el("tr", null, [el("th", { text: "Round" }), el("th", { text: "Points" })])]),
      tbody
    ]);

    var used = [];
    used.push(state.rewindUsed ? "🔄 Rewind used on card " + state.rewindUsed : "🔄 Rewind not used");
    used.push(state.hintUsed ? "📜 Ask the Scribe used on card " + state.hintUsed : "📜 Ask the Scribe not used");

    var card = el("section", { class: "card" }, [
      el("div", { class: "badge", text: "Pyramid complete" }),
      el("h2", { text: "Final Results" }),
      el("div", { class: "final-score", text: total + " pts" }),
      el("div", { class: "rank", text: rank }),
      el("p", { class: "prompt", text: msg }),
      el("div", { class: "scroll" }, [table]),
      el("p", { class: "meta", text: used.join(" · ") }),
      el("div", { class: "hintbox" }, [el("strong", { text: "📖 Up next: " }), el("span", { text: "Open your book to the paragraph you chose for homework. Find its topic sentence, evidence and analysis, and decide how well its last sentence works as a merging sentence." })]),
      el("div", { class: "row" }, [])
    ]);
    var row = card.lastChild;
    row.appendChild(el("button", { class: "primary", text: "↺ Play again", onclick: showIntro }));
    stage.appendChild(card);
    window.scrollTo(0, 0);
  }

  showIntro();
})();
</script>
</body>
</html>
